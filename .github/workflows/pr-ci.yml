name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source_quality:
    name: CI / source quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MERGE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the exact pull request merge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out merge identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify the change budget before dependency execution
        run: node scripts/vnext-rebaseline-budget.mjs

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/sandboxd/go.mod
          cache-dependency-path: apps/sandboxd/go.sum

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared first
        run: pnpm -F @cb/shared build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Fast unit and workflow contract tests
        run: pnpm test:fast

      - name: Record exact machine results for required source suites
        run: >-
          node scripts/test-truth.mjs run-group
          --source PR_SOURCE
          --target PR
          --candidate "$MERGE_SHA"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --results-dir "$RUNNER_TEMP/test-truth/source"

      - name: ShellCheck scripts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck \
            scripts/*.sh \
            scripts/integration/*.sh \
            infra/entrypoint.sh \
            infra/minio/init-buckets.sh \
            infra/k8s/overlays/sandbox-tools/maintenance/*.sh

      - name: Upload normalized source-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-test-truth-source-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test-truth/source/*.result.json
            ${{ runner.temp }}/test-truth/source/*.machine.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  billing_pg:
    name: CI / billing PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MERGE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora
          POSTGRES_DB: agora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agora"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out merge identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build creator agent protocol first
        run: pnpm -F @cb/creator-agent-protocol build

      - name: Build shared
        run: pnpm -F @cb/shared build

      - name: Install database client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Database migration
        env:
          DATABASE_URL: postgres://agora:agora@localhost:5432/agora
          POSTGRES_API_PASSWORD: ci-api-role-password
          POSTGRES_WORKER_PASSWORD: ci-worker-role-password
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-role-password
        run: bash scripts/integration/db-migrate.sh

      - name: Record exact machine results for required PostgreSQL suites
        env:
          AGENT_PACKAGE_REGISTRY_PG_TEST: '1'
          AGENT_SESSION_RECEIPTS_PG_TEST: '1'
          AGENT_SESSION_RECEIPTS_UPGRADE_PG_TEST: '1'
          PENDING_USAGE_RECOVERY_PG_TEST: '1'
          PENDING_USAGE_RECOVERY_UPGRADE_PG_TEST: '1'
          DATABASE_URL: postgres://agora:agora@localhost:5432/agora
          POSTGRES_API_PASSWORD: ci-api-role-password
          POSTGRES_WORKER_PASSWORD: ci-worker-role-password
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-role-password
          BILLING_PG_TEST: '1'
          BILLING_TEST_DATABASE_URL: postgres://agora:agora@localhost:5432/agora
          BILLING_AUTHORING_TEST_DATABASE_URL: postgres://combo_api:ci-api-role-password@localhost:5432/agora
          BILLING_RUNTIME_TEST_DATABASE_URL: postgres://combo_runtime:ci-runtime-role-password@localhost:5432/agora
        run: >-
          node scripts/test-truth.mjs run-group
          --source PR_INFRA
          --target PR
          --candidate "$MERGE_SHA"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --results-dir "$RUNNER_TEMP/test-truth/infra"

      - name: Upload normalized PostgreSQL-suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-test-truth-infra-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test-truth/infra/*.result.json
            ${{ runner.temp }}/test-truth/infra/*.machine.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  quality:
    name: CI / quality
    if: always()
    needs: [source_quality, billing_pg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGE_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_RESULT: ${{ needs.source_quality.result }}
      INFRA_RESULT: ${{ needs.billing_pg.result }}
    steps:
      - name: Check out the exact pull request merge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out merge identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == pull_request ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]]
          [[ "$(git rev-parse HEAD^1)" == "$BASE_SHA" ]]
          [[ "$(git rev-parse HEAD^2)" == "$HEAD_SHA" ]]
          git diff --quiet
          git diff --cached --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download source-suite evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: combo-test-truth-source-${{ github.run_id }}
          path: ${{ runner.temp }}/test-truth-input/source

      - name: Download PostgreSQL-suite evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: combo-test-truth-infra-${{ github.run_id }}
          path: ${{ runner.temp }}/test-truth-input/infra

      - name: Build the truthful PR report
        run: >-
          node scripts/test-truth.mjs aggregate
          --candidate "$MERGE_SHA"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --source-result "$SOURCE_RESULT"
          --infra-result "$INFRA_RESULT"
          --results-dir "$RUNNER_TEMP/test-truth-input"
          --output "$RUNNER_TEMP/test-truth-gate/report.json"
          --summary "$RUNNER_TEMP/test-truth-gate/summary.md"

      - name: Publish the truthful summary
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/test-truth-gate/summary.md" ]]; then
            cat "$RUNNER_TEMP/test-truth-gate/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# PR CI gate: FAIL\n\nTruth report generation did not complete.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the combined truth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-test-truth-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/test-truth-gate/report.json
            ${{ runner.temp }}/test-truth-gate/summary.md
            tests/test-suites/manifest.v1.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Enforce required evidence
        if: always()
        run: node scripts/test-truth.mjs enforce --report "$RUNNER_TEMP/test-truth-gate/report.json"
