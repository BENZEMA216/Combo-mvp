name: Preview promotion
run-name: Preview promotion for CI ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  policy:
    name: validate main release and repository promotion mode
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      revision: ${{ steps.policy.outputs.revision }}
      source_run_id: ${{ steps.policy.outputs.source_run_id }}
      source_run_attempt: ${{ steps.policy.outputs.source_run_attempt }}
      source_artifact_id: ${{ steps.policy.outputs.source_artifact_id }}
      source_artifact_name: ${{ steps.policy.outputs.source_artifact_name }}
      source_artifact_digest: ${{ steps.policy.outputs.source_artifact_digest }}
      test_run_id: ${{ steps.policy.outputs.test_run_id }}
      test_run_attempt: ${{ steps.policy.outputs.test_run_attempt }}
      test_evidence_artifact_id: ${{ steps.policy.outputs.test_evidence_artifact_id }}
      test_evidence_artifact_name: ${{ steps.policy.outputs.test_evidence_artifact_name }}
      test_evidence_artifact_digest: ${{ steps.policy.outputs.test_evidence_artifact_digest }}
      foundation_reset: ${{ steps.policy.outputs.foundation_reset }}
    steps:
      - name: Validate the trusted main CI run
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.COMBO_PREVIEW_AUTO_PROMOTION_MODE }}
          FOUNDATION_RESET_SHA: ${{ vars.COMBO_PREVIEW_FOUNDATION_RESET_SHA }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_PATH: ${{ github.event.workflow_run.path }}
          SOURCE_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_EVENT" == push ]]
          [[ "$SOURCE_BRANCH" == main ]]
          [[ "$SOURCE_PATH" == .github/workflows/ci.yml ]]
          [[ "$SOURCE_REPOSITORY" == "$GITHUB_REPOSITORY" ]]
          source_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          jq -e \
            --arg revision "$REVISION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson runId "$SOURCE_RUN_ID" \
            --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
              .id == $runId
              and .run_attempt == $runAttempt
              and .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .head_branch == "main"
              and .head_sha == $revision
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repository
            ' <<<"$source_run" >/dev/null

          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          artifact_name="combo-release-${REVISION}-${SOURCE_RUN_ATTEMPT}"
          artifacts="$work/source-artifacts.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts?per_page=100&name=${artifact_name}" \
            >"$artifacts"
          jq -e \
            --arg name "$artifact_name" \
            --argjson runId "$SOURCE_RUN_ID" '
              [.artifacts[] | select(.name == $name)] as $matches
              | ($matches | length) == 1
                and $matches[0].expired == false
                and $matches[0].workflow_run.id == $runId
                and ($matches[0].id | type == "number" and . > 0 and floor == .)
                and ($matches[0].digest | test("^sha256:[0-9a-f]{64}$"))
            ' "$artifacts" >/dev/null
          source_artifact_id=$(jq -er \
            --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name) | .id' \
            "$artifacts")
          source_artifact_digest=$(jq -er \
            --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name) | .digest' \
            "$artifacts")
          source_artifact_created_at=$(jq -er \
            --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name) | .created_at' \
            "$artifacts")
          source_attempt_jobs="$work/source-attempt-jobs.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}/jobs?per_page=100" \
            >"$source_attempt_jobs"
          jq -e \
            --arg artifactCreatedAt "$source_artifact_created_at" '
              [.jobs[]
                | select(.name == "assemble immutable release artifact")] as $releaseJobs
              | ($releaseJobs | length) == 1
                and $releaseJobs[0].status == "completed"
                and $releaseJobs[0].conclusion == "success"
                and ($releaseJobs[0].started_at | type == "string" and test("Z$"))
                and ($releaseJobs[0].completed_at | type == "string" and test("Z$"))
                and ($artifactCreatedAt | test("Z$"))
                and $releaseJobs[0].started_at <= $artifactCreatedAt
                and $artifactCreatedAt <= $releaseJobs[0].completed_at
            ' "$source_attempt_jobs" >/dev/null

          case "$MODE" in
            enabled)
              echo 'Preview automatic promotion is enabled.'
              ;;
            paused)
              echo 'Preview automatic promotion is explicitly paused by repository policy.'
              ;;
            *)
              echo 'COMBO_PREVIEW_AUTO_PROMOTION_MODE must be exactly enabled or paused.' >&2
              exit 1
              ;;
          esac
          [[ -z "$FOUNDATION_RESET_SHA" ||
            "$FOUNDATION_RESET_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'COMBO_PREVIEW_FOUNDATION_RESET_SHA must be empty or one complete SHA.' >&2
            exit 1
          }
          foundation_reset=false
          if [[ "$FOUNDATION_RESET_SHA" == "$REVISION" ]]; then
            foundation_reset=true
          fi

          test_run_id=
          test_run_attempt=
          test_evidence_artifact_id=
          test_evidence_artifact_name=
          test_evidence_artifact_digest=
          if [[ "$MODE" == enabled ]]; then
            test_runs="$work/test-runs.json"
            expected_test_title="Test deployment for CI ${SOURCE_RUN_ID} attempt ${SOURCE_RUN_ATTEMPT}"
            for _ in $(seq 1 900); do
              [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha')" == "$REVISION" ]] || {
                echo 'main advanced before the exact automatic Test completed.' >&2
                exit 1
              }
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/combo-dev.yml/runs?event=workflow_run&branch=main&head_sha=${REVISION}&per_page=100" \
                >"$test_runs"
              matching_test_runs=$(jq -c \
                --arg repository "$GITHUB_REPOSITORY" \
                --arg revision "$REVISION" \
                --arg title "$expected_test_title" '
                  [
                    .workflow_runs[]
                    | select(
                        .name == $title
                        and .display_title == $title
                        and .path == ".github/workflows/combo-dev.yml"
                        and .event == "workflow_run"
                        and .head_branch == "main"
                        and .head_sha == $revision
                        and .repository.full_name == $repository
                        and .head_repository.full_name == $repository
                      )
                  ]
                ' "$test_runs")
              matching_test_count=$(jq -r 'length' <<<"$matching_test_runs")
              [[ "$matching_test_count" =~ ^[0-9]+$ ]]
              if (( matching_test_count > 1 )); then
                echo 'Multiple automatic Test workflows matched the exact main CI run.' >&2
                exit 1
              fi
              if (( matching_test_count == 0 )); then
                sleep 20
                continue
              fi
              test_run_id=$(jq -er '.[0].id' <<<"$matching_test_runs")
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}" \
                >"$work/test-run.json"
              test_status=$(jq -er '.status' "$work/test-run.json")
              if [[ "$test_status" == completed ]]; then
                test_conclusion=$(jq -er '.conclusion' "$work/test-run.json")
                [[ "$test_conclusion" == success ]] || {
                  echo "The exact automatic Test concluded ${test_conclusion}." >&2
                  exit 1
                }
                break
              fi
              [[ "$test_status" == queued || "$test_status" == in_progress ||
                "$test_status" == waiting || "$test_status" == pending ||
                "$test_status" == requested ]] || {
                echo "The exact automatic Test has unexpected status ${test_status}." >&2
                exit 1
              }
              test_run_id=
              sleep 20
            done
          [[ "$test_run_id" =~ ^[1-9][0-9]*$ ]]
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$REVISION" \
            --arg title "$expected_test_title" \
            --argjson runId "$test_run_id" '
              .id == $runId
              and .name == $title
              and .display_title == $title
              and .path == ".github/workflows/combo-dev.yml"
              and .event == "workflow_run"
              and .head_branch == "main"
              and .head_sha == $revision
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
              and (.run_attempt | type == "number" and . > 0 and floor == .)
            ' "$work/test-run.json" >/dev/null
          test_run_attempt=$(jq -er '.run_attempt' "$work/test-run.json")
          [[ "$test_run_attempt" =~ ^[1-9][0-9]*$ ]]

          test_evidence_artifact_name="combo-test-evidence-${REVISION}-${test_run_attempt}"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}/artifacts?per_page=100&name=${test_evidence_artifact_name}" \
            >"$work/test-artifacts.json"
          test_repository_id=$(jq -er '.repository.id' "$work/test-run.json")
          jq -e \
            --arg name "$test_evidence_artifact_name" \
            --arg revision "$REVISION" \
            --argjson repositoryId "$test_repository_id" \
            --argjson runId "$test_run_id" '
              [.artifacts[] | select(.name == $name)] as $matches
              | .total_count == 1
                and ($matches | length) == 1
                and ($matches[0].id | type == "number" and . > 0 and floor == .)
                and (
                  $matches[0].size_in_bytes
                  | type == "number" and . > 0 and . <= 16777216 and floor == .
                )
                and $matches[0].expired == false
                and ($matches[0].digest | test("^sha256:[0-9a-f]{64}$"))
                and $matches[0].workflow_run.id == $runId
                and $matches[0].workflow_run.repository_id == $repositoryId
                and $matches[0].workflow_run.head_repository_id == $repositoryId
                and $matches[0].workflow_run.head_branch == "main"
                and $matches[0].workflow_run.head_sha == $revision
            ' "$work/test-artifacts.json" >/dev/null
          test_evidence_artifact_id=$(jq -er \
            --arg name "$test_evidence_artifact_name" \
            '.artifacts[] | select(.name == $name) | .id' \
            "$work/test-artifacts.json")
          test_evidence_artifact_digest=$(jq -er \
            --arg name "$test_evidence_artifact_name" \
            '.artifacts[] | select(.name == $name) | .digest' \
            "$work/test-artifacts.json")
          test_evidence_artifact_created_at=$(jq -er \
            --arg name "$test_evidence_artifact_name" \
            '.artifacts[] | select(.name == $name) | .created_at' \
            "$work/test-artifacts.json")
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${test_run_id}/attempts/${test_run_attempt}/jobs?per_page=100" \
            >"$work/test-attempt-jobs.json"
          jq -e \
            --arg artifactCreatedAt "$test_evidence_artifact_created_at" '
              [.jobs[]
                | select(.name == "deploy the trusted release to Test")] as $deployJobs
              | ($deployJobs | length) == 1
                and $deployJobs[0].status == "completed"
                and $deployJobs[0].conclusion == "success"
                and ($deployJobs[0].started_at | type == "string" and test("Z$"))
                and ($deployJobs[0].completed_at | type == "string" and test("Z$"))
                and ($artifactCreatedAt | test("Z$"))
                and $deployJobs[0].started_at <= $artifactCreatedAt
                and $artifactCreatedAt <= $deployJobs[0].completed_at
            ' "$work/test-attempt-jobs.json" >/dev/null
          fi
          {
            printf 'mode=%s\n' "$MODE"
            printf 'revision=%s\n' "$REVISION"
            printf 'source_run_id=%s\n' "$SOURCE_RUN_ID"
            printf 'source_run_attempt=%s\n' "$SOURCE_RUN_ATTEMPT"
            printf 'source_artifact_id=%s\n' "$source_artifact_id"
            printf 'source_artifact_name=%s\n' "$artifact_name"
            printf 'source_artifact_digest=%s\n' "$source_artifact_digest"
            printf 'test_run_id=%s\n' "$test_run_id"
            printf 'test_run_attempt=%s\n' "$test_run_attempt"
            printf 'test_evidence_artifact_id=%s\n' "$test_evidence_artifact_id"
            printf 'test_evidence_artifact_name=%s\n' "$test_evidence_artifact_name"
            printf 'test_evidence_artifact_digest=%s\n' "$test_evidence_artifact_digest"
            printf 'foundation_reset=%s\n' "$foundation_reset"
          } >> "$GITHUB_OUTPUT"

  recover_preview:
    name: recover a completed foreign Preview post-cut transaction
    if: needs.policy.outputs.mode == 'enabled'
    needs: policy
    concurrency:
      group: cd-tecent2
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloud-review
    steps:
      - name: Validate the protected recovery admission
        env:
          POLICY_MODE: ${{ needs.policy.outputs.mode }}
          ADMISSION_MODE: ${{ vars.COMBO_PREVIEW_AUTO_PROMOTION_MODE }}
        run: |
          set -euo pipefail
          [[ "$POLICY_MODE" == enabled ]]
          [[ "$ADMISSION_MODE" == enabled ]]

      - name: Download the exact recovery controller artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/combo-recovery-controller.zip"
          trap 'rm -f "$archive"' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            >"$archive"
          [[ -s "$archive" ]]
          [[ "$(sha256sum "$archive" | awk '{print "sha256:" $1}')" \
            == "$SOURCE_ARTIFACT_DIGEST" ]]
          mapfile -t archive_paths < <(unzip -Z1 "$archive")
          (( ${#archive_paths[@]} > 0 && ${#archive_paths[@]} <= 512 ))
          for path in "${archive_paths[@]}"; do
            [[ -n "$path" && "$path" != /* && "$path" != *\\* ]]
            [[ "/$path/" != */../* ]]
          done
          install -d -m 0700 "$RELEASE_ROOT"
          unzip -q "$archive" -d "$RELEASE_ROOT"
          (
            cd "$RELEASE_ROOT"
            sha256sum -c metadata/artifact-files.sha256 >/dev/null
          )

      - name: Configure the recovery SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1
          {
            echo 'Host release-target'
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  UserKnownHostsFile ~/.ssh/known_hosts'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            echo '  ServerAliveInterval 30'
            echo '  ServerAliveCountMax 20'
            echo '  TCPKeepAlive yes'
            echo '  LogLevel ERROR'
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config"

      - name: Recover the exact foreign Preview checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_MODE: ${{ needs.policy.outputs.mode }}
          ADMISSION_MODE: ${{ vars.COMBO_PREVIEW_AUTO_PROMOTION_MODE }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$POLICY_MODE" == enabled ]]
          [[ "$ADMISSION_MODE" == enabled ]]

          revalidate_recovery_authority() {
            local source_run source_artifact
            source_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg revision "$REVISION" \
              --argjson runId "$SOURCE_RUN_ID" \
              --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
                .id == $runId
                and .run_attempt == $runAttempt
                and .path == ".github/workflows/ci.yml"
                and .event == "push"
                and .head_branch == "main"
                and .head_sha == $revision
                and .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
              ' <<<"$source_run" >/dev/null
            source_artifact=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")
            jq -e \
              --arg name "$SOURCE_ARTIFACT_NAME" \
              --arg revision "$REVISION" \
              --arg digest "$SOURCE_ARTIFACT_DIGEST" \
              --argjson artifactId "$SOURCE_ARTIFACT_ID" \
              --argjson runId "$SOURCE_RUN_ID" \
              --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
                .id == $artifactId
                and .name == $name
                and .name == (
                  "combo-release-" + $revision + "-" + ($runAttempt | tostring)
                )
                and .digest == $digest
                and .expired == false
                and .workflow_run.id == $runId
                and .workflow_run.head_branch == "main"
                and .workflow_run.head_sha == $revision
              ' <<<"$source_artifact" >/dev/null
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha')" == "$REVISION" ]]
            [[ "$POLICY_MODE" == enabled ]]
            [[ "$ADMISSION_MODE" == enabled ]]
          }

          revalidate_recovery_authority
          archive="$RUNNER_TEMP/combo-release-preview-recovery-${REVISION}.tar.gz"
          tar -C "$RELEASE_ROOT" -czf "$archive" .
          chmod 0600 "$archive"
          remote="data/combo-release-incoming/${REVISION}.preview-recovery.${RUN_ID}.${RUN_ATTEMPT}.tar.gz"
          temporary=".${REVISION}.preview-recovery.${RUN_ID}.${RUN_ATTEMPT}.upload"
          ssh release-target 'install -d -m 0700 "$HOME/data/combo-release-incoming"'
          scp -q "$archive" "release-target:$temporary"
          ssh release-target mv -fT -- "$temporary" "$remote"
          revalidate_recovery_authority
          ssh release-target bash -s -- "$remote" "$REVISION" <<'REMOTE'
          set -euo pipefail
          incoming=$1
          revision=$2
          [[ "$incoming" == \
            "data/combo-release-incoming/${revision}.preview-recovery."*.tar.gz ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          archive="$HOME/$incoming"
          [[ -f "$archive" && ! -L "$archive" ]]
          work=$(mktemp -d "$HOME/data/combo-release-preview-recovery.XXXXXX")
          cleanup() {
            rm -f -- "$archive"
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          tar -xzf "$archive" --no-same-owner -C "$work"
          (
            cd "$work"
            sha256sum -c metadata/artifact-files.sha256 >/dev/null
          )
          chmod 0700 \
            "$work/scripts/deploy-release.sh" \
            "$work/scripts/recover-preview-post-cut.sh"
          [[ -f "$HOME/.nvm/nvm.sh" && ! -L "$HOME/.nvm/nvm.sh" &&
            -s "$HOME/.nvm/nvm.sh" ]]
          # shellcheck disable=SC1091
          source "$HOME/.nvm/nvm.sh"
          nvm use 24 >/dev/null
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          bash "$work/scripts/recover-preview-post-cut.sh" \
            --candidate-source-sha "$revision"
          REMOTE

  deploy:
    name: deploy the main release artifact to Preview
    if: needs.policy.outputs.mode == 'enabled'
    needs: [policy, recover_preview]
    concurrency:
      group: cd-tecent2
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: cloud-review
    steps:
      - name: Validate protected Preview acceptance inputs before mutation
        env:
          REVIEW_ACCESS_TOKEN: ${{ secrets.CLOUD_REVIEW_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$REVIEW_ACCESS_TOKEN" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'The protected cloud-review Environment lacks a valid CLOUD_REVIEW_ACCESS_TOKEN.' >&2
            exit 1
          }

      - name: Use Node.js 24 for immutable release validators
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the exact release artifact and verify its GitHub digest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
        run: |
          set -euo pipefail
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/combo-release.zip"
          trap 'rm -f "$archive"' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            >"$archive"
          [[ -s "$archive" ]]
          [[ "$(sha256sum "$archive" | awk '{print "sha256:" $1}')" \
            == "$SOURCE_ARTIFACT_DIGEST" ]]
          mapfile -t archive_paths < <(unzip -Z1 "$archive")
          (( ${#archive_paths[@]} > 0 && ${#archive_paths[@]} <= 512 ))
          for path in "${archive_paths[@]}"; do
            [[ -n "$path" && "$path" != /* && "$path" != *\\* ]]
            [[ "/$path/" != */../* ]]
          done
          install -d -m 0700 "$RELEASE_ROOT"
          unzip -q "$archive" -d "$RELEASE_ROOT"

      - name: Verify release identity and all bundled files
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
        run: |
          set -euo pipefail
          (
            cd "$RELEASE_ROOT"
            sha256sum -c metadata/artifact-files.sha256 >/dev/null
          )
          manifest_digest=$(<"$RELEASE_ROOT/metadata/release-manifest-digest.txt")
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          node "$RELEASE_ROOT/scripts/release-manifest.mjs" verify \
            --manifest "$RELEASE_ROOT/metadata/release.json" \
            --source-sha "$REVISION" \
            --digest "$manifest_digest" >/dev/null
          node "$RELEASE_ROOT/scripts/web-asset-manifest.mjs" verify \
            --manifest "$RELEASE_ROOT/metadata/web-asset-manifest.json" \
            --digest "$(jq -er '.webAssetManifest' "$RELEASE_ROOT/metadata/release.json")" >/dev/null
          for phase in foundation init migrate apps; do
            [[ -s "$RELEASE_ROOT/rendered/preview/$phase.yaml" ]]
          done

      - name: Download and validate the exact successful Test admission
        id: test_admission
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          TEST_EVIDENCE_ROOT: ${{ runner.temp }}/test-evidence
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          TEST_RUN_ID: ${{ needs.policy.outputs.test_run_id }}
          TEST_RUN_ATTEMPT: ${{ needs.policy.outputs.test_run_attempt }}
          TEST_EVIDENCE_ARTIFACT_ID: ${{ needs.policy.outputs.test_evidence_artifact_id }}
          TEST_EVIDENCE_ARTIFACT_NAME: ${{ needs.policy.outputs.test_evidence_artifact_name }}
          TEST_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.test_evidence_artifact_digest }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          for value in \
            "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" "$SOURCE_ARTIFACT_ID" \
            "$TEST_RUN_ID" "$TEST_RUN_ATTEMPT" "$TEST_EVIDENCE_ARTIFACT_ID"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$SOURCE_ARTIFACT_NAME" == \
            "combo-release-${REVISION}-${SOURCE_RUN_ATTEMPT}" ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TEST_EVIDENCE_ARTIFACT_NAME" == \
            "combo-test-evidence-${REVISION}-${TEST_RUN_ATTEMPT}" ]]
          [[ "$TEST_EVIDENCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          archive="$RUNNER_TEMP/test-evidence.zip"
          trap 'rm -f "$archive"' EXIT
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEST_EVIDENCE_ARTIFACT_ID}/zip" \
            >"$archive"
          [[ -s "$archive" ]]
          [[ "$(sha256sum "$archive" | awk '{print "sha256:" $1}')" \
            == "$TEST_EVIDENCE_ARTIFACT_DIGEST" ]]
          mapfile -t archive_paths < <(unzip -Z1 "$archive" | LC_ALL=C sort)
          expected_paths=(
            "combo-test-evidence-${REVISION}.json"
            source-release.json
            test-live-browser-acceptance.json
            test-promotion-identity.json
          )
          [[ "${#archive_paths[@]}" == "${#expected_paths[@]}" ]]
          for index in "${!expected_paths[@]}"; do
            [[ "${archive_paths[$index]}" == "${expected_paths[$index]}" ]]
          done
          install -d -m 0700 "$TEST_EVIDENCE_ROOT"
          unzip -q "$archive" -d "$TEST_EVIDENCE_ROOT"
          if find "$TEST_EVIDENCE_ROOT" -type l -print -quit | grep -q .; then
            echo 'Test evidence artifact contains a symbolic link.' >&2
            exit 1
          fi
          for path in "${expected_paths[@]}"; do
            file="$TEST_EVIDENCE_ROOT/$path"
            [[ -f "$file" && ! -L "$file" ]]
            bytes=$(stat -c '%s' "$file")
            [[ "$bytes" =~ ^[0-9]+$ && "$bytes" -gt 0 && "$bytes" -le 1048576 ]]
            chmod 0600 "$file"
          done

          identity="$TEST_EVIDENCE_ROOT/test-promotion-identity.json"
          browser="$TEST_EVIDENCE_ROOT/test-live-browser-acceptance.json"
          source_release="$TEST_EVIDENCE_ROOT/source-release.json"
          deployment="$TEST_EVIDENCE_ROOT/combo-test-evidence-${REVISION}.json"
          validator="$RELEASE_ROOT/scripts/promotion-evidence.mjs"
          identity_digest=$(node "$validator" validate-identity --identity "$identity")
          browser_digest=$(node "$validator" validate-live-browser \
            --environment test \
            --evidence "$browser" \
            --identity "$identity")
          [[ "$identity_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$browser_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          release_id=$(jq -er '.releaseId' "$RELEASE_ROOT/metadata/release.json")
          manifest_digest=$(<"$RELEASE_ROOT/metadata/release-manifest-digest.txt")
          file_set_digest=$(sha256sum "$RELEASE_ROOT/metadata/artifact-files.sha256" |
            awk '{print "sha256:" $1}')
          web_asset_digest=$(jq -er \
            '.webAssetManifest' "$RELEASE_ROOT/metadata/release.json")
          api_image=$(jq -er '.images.api' "$RELEASE_ROOT/metadata/release.json")
          runtime_image=$(jq -er '.images.runtime' "$RELEASE_ROOT/metadata/release.json")
          web_image=$(jq -er '.images.web' "$RELEASE_ROOT/metadata/release.json")
          jq -e \
            --arg revision "$REVISION" \
            --argjson sourceRunId "$SOURCE_RUN_ID" \
            --argjson sourceRunAttempt "$SOURCE_RUN_ATTEMPT" \
            --argjson sourceArtifactId "$SOURCE_ARTIFACT_ID" \
            --arg sourceArtifactName "$SOURCE_ARTIFACT_NAME" \
            --arg sourceArtifactDigest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson testRunId "$TEST_RUN_ID" \
            --argjson testRunAttempt "$TEST_RUN_ATTEMPT" \
            --arg releaseId "$release_id" \
            --arg manifestDigest "$manifest_digest" \
            --arg fileSetDigest "$file_set_digest" \
            --arg webAssetDigest "$web_asset_digest" \
            --arg apiImage "$api_image" \
            --arg runtimeImage "$runtime_image" \
            --arg webImage "$web_image" '
              .schemaVersion == 1
              and .environment == "test"
              and .namespace == "combo-preview"
              and .sourceSha == $revision
              and .sourceCiRunId == $sourceRunId
              and .sourceCiRunAttempt == $sourceRunAttempt
              and .deploymentWorkflow == ".github/workflows/combo-dev.yml"
              and .deploymentRunId == $testRunId
              and .deploymentRunAttempt == $testRunAttempt
              and .releaseArtifactId == $sourceArtifactId
              and .releaseArtifactName == $sourceArtifactName
              and .releaseArtifactDigest == $sourceArtifactDigest
              and .releaseId == $releaseId
              and .releaseManifestDigest == $manifestDigest
              and .artifactFileSetDigest == $fileSetDigest
              and .webAssetManifestDigest == $webAssetDigest
              and .images == {
                api: $apiImage,
                runtime: $runtimeImage,
                web: $webImage
              }
            ' "$identity" >/dev/null
          jq -e \
            --arg controllerSha "$REVISION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$REVISION" \
            --argjson sourceRunId "$SOURCE_RUN_ID" \
            --argjson sourceRunAttempt "$SOURCE_RUN_ATTEMPT" \
            --argjson sourceArtifactId "$SOURCE_ARTIFACT_ID" \
            --arg sourceArtifactName "$SOURCE_ARTIFACT_NAME" \
            --arg sourceArtifactDigest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson testRunId "$TEST_RUN_ID" \
            --argjson testRunAttempt "$TEST_RUN_ATTEMPT" \
            --arg releaseId "$release_id" \
            --arg manifestDigest "$manifest_digest" \
            --arg fileSetDigest "$file_set_digest" \
            --arg webAssetDigest "$web_asset_digest" \
            --arg identityDigest "$identity_digest" \
            --arg browserDigest "$browser_digest" \
            --arg apiImage "$api_image" \
            --arg runtimeImage "$runtime_image" \
            --arg webImage "$web_image" '
              keys == ([
                "artifactFileSetDigest",
                "controllerSha",
                "images",
                "liveBrowserAcceptanceDigest",
                "migrationHead",
                "releaseArtifactDigest",
                "releaseArtifactId",
                "releaseArtifactName",
                "releaseId",
                "releaseManifestDigest",
                "schemaVersion",
                "sourceBranch",
                "sourceCiRunAttempt",
                "sourceCiRunId",
                "sourceConclusion",
                "sourceEvent",
                "sourceMode",
                "sourceRepository",
                "sourceSha",
                "sourceWorkflow",
                "testIdentityDigest",
                "testRunAttempt",
                "testRunId",
                "webAssetManifestDigest"
              ] | sort)
              and .schemaVersion == 1
              and .controllerSha == $controllerSha
              and .sourceRepository == $repository
              and .sourceWorkflow == ".github/workflows/ci.yml"
              and .sourceEvent == "push"
              and .sourceBranch == "main"
              and .sourceMode == "main-ci"
              and .sourceConclusion == "success"
              and .sourceSha == $revision
              and .sourceCiRunId == $sourceRunId
              and .sourceCiRunAttempt == $sourceRunAttempt
              and .testRunId == $testRunId
              and .testRunAttempt == $testRunAttempt
              and .releaseArtifactId == $sourceArtifactId
              and .releaseArtifactName == $sourceArtifactName
              and .releaseArtifactDigest == $sourceArtifactDigest
              and .releaseId == $releaseId
              and .releaseManifestDigest == $manifestDigest
              and .artifactFileSetDigest == $fileSetDigest
              and .webAssetManifestDigest == $webAssetDigest
              and .testIdentityDigest == $identityDigest
              and .liveBrowserAcceptanceDigest == $browserDigest
              and .migrationHead == "0009_billing.sql"
              and .images == {
                api: $apiImage,
                runtime: $runtimeImage,
                web: $webImage
              }
            ' "$source_release" >/dev/null
          jq -e \
            --arg revision "$REVISION" \
            --arg testRunId "$TEST_RUN_ID" \
            --arg releaseId "$release_id" \
            --arg manifestDigest "$manifest_digest" \
            --arg webAssetDigest "$web_asset_digest" \
            --arg apiImage "$api_image" \
            --arg runtimeImage "$runtime_image" \
            --arg webImage "$web_image" '
              (has("productAcceptance") | not)
              and .schemaVersion == 1
              and .workflowRunId == $testRunId
              and .sourceSha == $revision
              and .releaseId == $releaseId
              and .releaseManifestDigest == $manifestDigest
              and .webAssetManifest == $webAssetDigest
              and .images == {
                api: $apiImage,
                runtime: $runtimeImage,
                web: $webImage
              }
            ' "$deployment" >/dev/null

          source_release_digest=$(sha256sum "$source_release" | awk '{print "sha256:" $1}')
          deployment_digest=$(sha256sum "$deployment" | awk '{print "sha256:" $1}')
          [[ "$source_release_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$deployment_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'identity_digest=%s\n' "$identity_digest"
            printf 'browser_digest=%s\n' "$browser_digest"
            printf 'source_release_digest=%s\n' "$source_release_digest"
            printf 'deployment_digest=%s\n' "$deployment_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Configure the existing deployment SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_SSH_KNOWN_HOSTS" ]]
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key"
          chmod 0600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null 2>&1
          {
            echo 'Host release-target'
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo '  IdentityFile ~/.ssh/deploy_key'
            echo '  UserKnownHostsFile ~/.ssh/known_hosts'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking yes'
            echo '  BatchMode yes'
            echo '  ServerAliveInterval 30'
            echo '  ServerAliveCountMax 20'
            echo '  TCPKeepAlive yes'
            echo '  LogLevel ERROR'
          } > "$HOME/.ssh/config"
          chmod 0600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"

      - name: Preflight the tecent2 release host without mutation
        run: |
          set -euo pipefail
          ssh release-target bash -s <<'REMOTE'
          set -euo pipefail
          [[ "$(id -un)" == xingzheng && "$HOME" == /home/xingzheng ]]
          for command in node jq sha256sum flock cmp awk install mktemp realpath grep mv \
            rm dirname sleep seq tr sort sudo curl stat date systemctl ss kubectl tar; do
            command -v "$command" >/dev/null
          done
          [[ "$(uname -m)" == x86_64 ]]
          [[ -f "$HOME/.nvm/nvm.sh" && ! -L "$HOME/.nvm/nvm.sh" &&
            -s "$HOME/.nvm/nvm.sh" ]]
          # shellcheck disable=SC1091
          source "$HOME/.nvm/nvm.sh"
          nvm use 24 >/dev/null
          node_major=$(node -p 'Number(process.versions.node.split(".")[0])')
          [[ "$node_major" =~ ^[0-9]+$ && "$node_major" -ge 24 ]]
          [[ -x /usr/local/bin/kubectl && -f "$HOME/.kube/config" ]]
          LC_ALL=C sudo -n -l | grep -Eq 'NOPASSWD:[[:space:]]*ALL'
          sudo -n systemctl is-active --quiet k3s
          sudo -n nginx -t >/dev/null
          sudo -n ss -H -lnt >/dev/null
          sudo -n realpath -e "$HOME/data/k3s/storage" >/dev/null
          kubectl --kubeconfig "$HOME/.kube/config" get namespace combo-review >/dev/null
          kubectl --kubeconfig "$HOME/.kube/config" auth can-i '*' '*' \
            --all-namespaces | grep -Fxq yes
          REMOTE

      - name: Revalidate all frozen admissions immediately before the first Preview mutation
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_MODE: ${{ needs.policy.outputs.mode }}
          ADMISSION_MODE: ${{ vars.COMBO_PREVIEW_AUTO_PROMOTION_MODE }}
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          TEST_RUN_ID: ${{ needs.policy.outputs.test_run_id }}
          TEST_RUN_ATTEMPT: ${{ needs.policy.outputs.test_run_attempt }}
          TEST_EVIDENCE_ARTIFACT_ID: ${{ needs.policy.outputs.test_evidence_artifact_id }}
          TEST_EVIDENCE_ARTIFACT_NAME: ${{ needs.policy.outputs.test_evidence_artifact_name }}
          TEST_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.test_evidence_artifact_digest }}
          FOUNDATION_RESET: ${{ needs.policy.outputs.foundation_reset }}
          FOUNDATION_RESET_SHA: ${{ vars.COMBO_PREVIEW_FOUNDATION_RESET_SHA }}
        run: |
          set -euo pipefail
          [[ "$POLICY_MODE" == enabled ]]
          [[ "$ADMISSION_MODE" == enabled ]]
          [[ "$FOUNDATION_RESET" == true || "$FOUNDATION_RESET" == false ]]
          if [[ "$FOUNDATION_RESET" == true ]]; then
            [[ "$FOUNDATION_RESET_SHA" == "$REVISION" ]]
          else
            [[ -z "$FOUNDATION_RESET_SHA" || "$FOUNDATION_RESET_SHA" != "$REVISION" ]]
          fi
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" \
            == "$REVISION" ]]

          source_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$REVISION" \
            --argjson runId "$SOURCE_RUN_ID" \
            --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
              .id == $runId
              and .run_attempt == $runAttempt
              and .path == ".github/workflows/ci.yml"
              and .event == "push"
              and .head_branch == "main"
              and .head_sha == $revision
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
            ' <<<"$source_run" >/dev/null
          source_artifact=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")
          jq -e \
            --arg name "$SOURCE_ARTIFACT_NAME" \
            --arg revision "$REVISION" \
            --arg digest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson artifactId "$SOURCE_ARTIFACT_ID" \
            --argjson runId "$SOURCE_RUN_ID" \
            --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
              .id == $artifactId
              and .name == $name
              and .name == (
                "combo-release-" + $revision + "-" + ($runAttempt | tostring)
              )
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $runId
              and .workflow_run.head_branch == "main"
              and .workflow_run.head_sha == $revision
            ' <<<"$source_artifact" >/dev/null

          test_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}")
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg revision "$REVISION" \
            --arg title "Test deployment for CI ${SOURCE_RUN_ID} attempt ${SOURCE_RUN_ATTEMPT}" \
            --argjson runId "$TEST_RUN_ID" \
            --argjson runAttempt "$TEST_RUN_ATTEMPT" '
              .id == $runId
              and .run_attempt == $runAttempt
              and .name == $title
              and .display_title == $title
              and .path == ".github/workflows/combo-dev.yml"
              and .event == "workflow_run"
              and .head_branch == "main"
              and .head_sha == $revision
              and .status == "completed"
              and .conclusion == "success"
              and .repository.full_name == $repository
              and .head_repository.full_name == $repository
            ' <<<"$test_run" >/dev/null
          test_evidence_artifact=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${TEST_EVIDENCE_ARTIFACT_ID}")
          jq -e \
            --arg name "$TEST_EVIDENCE_ARTIFACT_NAME" \
            --arg revision "$REVISION" \
            --arg digest "$TEST_EVIDENCE_ARTIFACT_DIGEST" \
            --argjson artifactId "$TEST_EVIDENCE_ARTIFACT_ID" \
            --argjson runId "$TEST_RUN_ID" \
            --argjson runAttempt "$TEST_RUN_ATTEMPT" '
              .id == $artifactId
              and .name == $name
              and .name == (
                "combo-test-evidence-" + $revision + "-" + ($runAttempt | tostring)
              )
              and .digest == $digest
              and .expired == false
              and .workflow_run.id == $runId
              and .workflow_run.head_branch == "main"
              and .workflow_run.head_sha == $revision
            ' <<<"$test_evidence_artifact" >/dev/null

      - name: Check the existing Preview registry credential
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          image=$(jq -er '.images.web' "$RELEASE_ROOT/metadata/release.json")
          [[ "$image" =~ ^ghcr\.io/dangdang-tech/combo-web@sha256:[0-9a-f]{64}$ ]]
          name="combo-preview-pull-${RUN_ID}-${RUN_ATTEMPT}"
          [[ "$name" =~ ^[a-z0-9-]{1,63}$ ]]
          if ssh release-target bash -s -- \
            "$name" "$image" "$RUN_ID" "$RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          name=$1
          image=$2
          run_id=$3
          run_attempt=$4
          kubeconfig="$HOME/.kube/config"
          [[ "$name" =~ ^combo-preview-pull-[0-9]+-[0-9]+$ ]]
          [[ "$image" =~ ^ghcr\.io/dangdang-tech/combo-web@sha256:[0-9a-f]{64}$ ]]
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$name" == "combo-preview-pull-${run_id}-${run_attempt}" ]]
          ! kubectl --kubeconfig "$kubeconfig" -n combo-review \
            get "pod/$name" >/dev/null 2>&1
          created=0
          uid=
          cleanup() {
            local rc=$? cleanup_failed=0 delete_uid live live_uid removed=0
            trap - EXIT
            set +e
            if ((created == 1)); then
              if ! live=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
                get "pod/$name" --ignore-not-found -o json 2>/dev/null); then
                cleanup_failed=1
              elif [[ -z "$live" ]]; then
                removed=1
              else
                live_uid=$(jq -er '.metadata.uid' <<<"$live")
                if [[ -n "$uid" && "$live_uid" != "$uid" ]] ||
                  ! jq -e \
                    --arg runId "$run_id" \
                    --arg runAttempt "$run_attempt" \
                    --arg image "$image" '
                      .metadata.labels["combo.build/smoke"] == "ghcr-pull"
                      and .metadata.labels["combo.build/workflow-run"] == $runId
                      and .metadata.labels["combo.build/workflow-attempt"] == $runAttempt
                      and (.spec.containers | length) == 1
                      and .spec.containers[0].image == $image
                    ' \
                    <<<"$live" >/dev/null; then
                  cleanup_failed=1
                else
                  delete_uid=$live_uid
                  jq -n --arg uid "$delete_uid" '{
                    apiVersion: "v1",
                    kind: "DeleteOptions",
                    propagationPolicy: "Foreground",
                    preconditions: {uid: $uid}
                  }' |
                    kubectl --kubeconfig "$kubeconfig" \
                      delete --raw="/api/v1/namespaces/combo-review/pods/$name" \
                      -f - >/dev/null 2>&1 || cleanup_failed=1
                  for _ in $(seq 1 60); do
                    if ! live=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
                      get "pod/$name" --ignore-not-found -o json 2>/dev/null); then
                      cleanup_failed=1
                      break
                    fi
                    if [[ -z "$live" ]]; then
                      removed=1
                      break
                    fi
                    live_uid=$(jq -er '.metadata.uid' <<<"$live")
                    [[ "$live_uid" == "$delete_uid" ]] || {
                      cleanup_failed=1
                      break
                    }
                    sleep 1
                  done
                  ((removed == 1)) || cleanup_failed=1
                fi
              fi
            fi
            ((cleanup_failed == 0)) || exit 12
            exit "$rc"
          }
          trap cleanup EXIT
          auth_failure_text() {
            case "$1" in
              *"failed to fetch oauth token"*401* | \
                *"failed to fetch oauth token"*403* | \
                *"failed to authorize"*Unauthorized* | \
                *"failed to authorize"*Forbidden* | \
              *Unauthorized* | *unauthorized* | *denied* | \
                *"authentication required"* | *"no basic auth credentials"* | \
                *invalid_token* | *insufficient_scope*) return 0 ;;
              *) return 1 ;;
            esac
          }
          auth_failure_event() {
            local messages
            messages=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
              get events -o json |
              jq -r --arg uid "$uid" '
                .items[]
                | select(.involvedObject.uid == $uid and .reason == "Failed")
                | .message
              ')
            auth_failure_text "$messages"
          }
          overrides=$(jq -nc \
            --arg runId "$run_id" \
            --arg runAttempt "$run_attempt" '{
              metadata: {
                labels: {
                  "combo.build/smoke": "ghcr-pull",
                  "combo.build/workflow-run": $runId,
                  "combo.build/workflow-attempt": $runAttempt
                }
              },
              spec: {
                imagePullSecrets: [{name: "combo-preview-ghcr-pull"}]
              }
            }')
          created=1
          uid=$(kubectl --kubeconfig "$kubeconfig" -n combo-review run "$name" \
            --image="$image" \
            --image-pull-policy=Always \
            --restart=Never \
            --overrides="$overrides" \
            -o json --command -- /bin/sh -c 'exit 0' | jq -er '.metadata.uid')
          [[ -n "$uid" ]]
          for _ in $(seq 1 45); do
            phase=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
              get "pod/$name" -o jsonpath='{.status.phase}')
            [[ "$phase" != Succeeded ]] || exit 0
            [[ "$phase" != Failed ]] || exit 11
            reason=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
              get "pod/$name" \
              -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' \
              2>/dev/null || true)
            if [[ "$reason" == ImagePullBackOff || "$reason" == ErrImagePull ]]; then
              message=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
                get "pod/$name" \
                -o jsonpath='{.status.containerStatuses[0].state.waiting.message}' \
                2>/dev/null || true)
              if auth_failure_text "$message" || auth_failure_event; then
                exit 10
              fi
            fi
            sleep 2
          done
          auth_failure_event && exit 10
          exit 11
          REMOTE
          then
            :
          else
            rc=$?
            [[ "$rc" == 10 ]] || exit "$rc"
            echo 'The persistent combo-preview-ghcr-pull credential is invalid.' >&2
            echo 'Configure a long-lived read:packages credential; workflow tokens are not persisted.' >&2
            exit 1
          fi

      - name: Upload and deploy the exact Preview bundle
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_MODE: ${{ needs.policy.outputs.mode }}
          ADMISSION_MODE: ${{ vars.COMBO_PREVIEW_AUTO_PROMOTION_MODE }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FOUNDATION_RESET: ${{ needs.policy.outputs.foundation_reset }}
          FOUNDATION_RESET_SHA: ${{ vars.COMBO_PREVIEW_FOUNDATION_RESET_SHA }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ && "$RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$POLICY_MODE" == enabled ]]
          [[ "$ADMISSION_MODE" == enabled ]]
          [[ "$FOUNDATION_RESET" == true || "$FOUNDATION_RESET" == false ]]
          if [[ "$FOUNDATION_RESET" == true ]]; then
            [[ "$FOUNDATION_RESET_SHA" == "$REVISION" ]]
          else
            [[ -z "$FOUNDATION_RESET_SHA" || "$FOUNDATION_RESET_SHA" != "$REVISION" ]]
          fi

          revalidate_deployment_authority() {
            local source_run source_artifact
            source_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg revision "$REVISION" \
              --argjson runId "$SOURCE_RUN_ID" \
              --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
                .id == $runId
                and .run_attempt == $runAttempt
                and .path == ".github/workflows/ci.yml"
                and .event == "push"
                and .head_branch == "main"
                and .head_sha == $revision
                and .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repository
                and .head_repository.full_name == $repository
              ' <<<"$source_run" >/dev/null
            source_artifact=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}")
            jq -e \
              --arg name "$SOURCE_ARTIFACT_NAME" \
              --arg revision "$REVISION" \
              --arg digest "$SOURCE_ARTIFACT_DIGEST" \
              --argjson artifactId "$SOURCE_ARTIFACT_ID" \
              --argjson runId "$SOURCE_RUN_ID" \
              --argjson runAttempt "$SOURCE_RUN_ATTEMPT" '
                .id == $artifactId
                and .name == $name
                and .name == (
                  "combo-release-" + $revision + "-" + ($runAttempt | tostring)
                )
                and .digest == $digest
                and .expired == false
                and .workflow_run.id == $runId
                and .workflow_run.head_branch == "main"
                and .workflow_run.head_sha == $revision
              ' <<<"$source_artifact" >/dev/null
            [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha')" == "$REVISION" ]]
            [[ "$POLICY_MODE" == enabled ]]
            [[ "$ADMISSION_MODE" == enabled ]]
            if [[ "$FOUNDATION_RESET" == true ]]; then
              [[ "$FOUNDATION_RESET_SHA" == "$REVISION" ]]
            else
              [[ -z "$FOUNDATION_RESET_SHA" ||
                "$FOUNDATION_RESET_SHA" != "$REVISION" ]]
            fi
          }

          revalidate_deployment_authority
          archive="$RUNNER_TEMP/combo-release-preview-${REVISION}.tar.gz"
          tar -C "$RELEASE_ROOT" -czf "$archive" .
          chmod 0600 "$archive"

          remote="data/combo-release-incoming/${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.tar.gz"
          temporary=".${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.upload"
          ssh release-target 'install -d -m 0700 "$HOME/data/combo-release-incoming"'
          scp -q "$archive" "release-target:$temporary"
          ssh release-target mv -fT -- "$temporary" "$remote"
          [[ "$POLICY_MODE" == enabled ]]
          [[ "$ADMISSION_MODE" == enabled ]]
          revalidate_deployment_authority
          ssh release-target bash -s -- \
            "$remote" "$REVISION" "$FOUNDATION_RESET" <<'REMOTE'
          set -euo pipefail
          incoming=$1
          revision=$2
          foundation_reset=$3
          [[ "$incoming" == "data/combo-release-incoming/${revision}.preview."*.tar.gz ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$foundation_reset" == true || "$foundation_reset" == false ]]
          archive="$HOME/$incoming"
          [[ -f "$archive" && ! -L "$archive" ]]
          work=$(mktemp -d "$HOME/data/combo-release-preview.XXXXXX")
          cleanup() {
            rm -f -- "$archive"
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          tar -xzf "$archive" --no-same-owner -C "$work"
          (
            cd "$work"
            sha256sum -c metadata/artifact-files.sha256 >/dev/null
          )
          manifest_digest=$(<"$work/metadata/release-manifest-digest.txt")
          chmod 0700 \
            "$work/scripts/collect-release-inventory.sh" \
            "$work/scripts/deploy-release.sh" \
            "$work/scripts/reset-release-foundation.sh" \
            "$work/scripts/rollback-release-traffic.sh" \
            "$work/scripts/seal-release-traffic.sh" \
            "$work/scripts/switch-release-traffic.sh"
          [[ -f "$HOME/.nvm/nvm.sh" && ! -L "$HOME/.nvm/nvm.sh" &&
            -s "$HOME/.nvm/nvm.sh" ]]
          # shellcheck disable=SC1091
          source "$HOME/.nvm/nvm.sh"
          nvm use 24 >/dev/null
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          deploy_args=()
          release_directory="$HOME/data/combo-releases/goal-a/preview/release-${revision}"
          pending_checkpoint="$HOME/data/combo-releases/goal-a/preview/pending.json"
          reset_output="${release_directory}.foundation-reset.json"
          authority_digest=$manifest_digest
          reset_request_id=$(printf '%s\0%s\0%s\0%s\0%s' \
            combo-foundation-reset-v1 preview "$revision" \
            "$manifest_digest" established-clean-slate-v1 |
            sha256sum | awk '{print "sha256:" $1}')
          if [[ -e "$release_directory" || -L "$release_directory" ]]; then
            [[ -d "$release_directory" && ! -L "$release_directory" ]]
            (
              cd "$release_directory"
              sha256sum --quiet -c SHA256SUMS
            )
            [[ "$(<"$release_directory/release.sha256")" == "$manifest_digest" ]]
            cmp -s "$work/metadata/release.json" "$release_directory/release.json"
            if [[ "$foundation_reset" == true ]]; then
              foundation_reset_evidence="$release_directory/foundation-reset-evidence.json"
              [[ -f "$foundation_reset_evidence" &&
                ! -L "$foundation_reset_evidence" ]]
              reset_digest=$(sha256sum "$foundation_reset_evidence" |
                awk '{print "sha256:" $1}')
              [[ "$(jq -er '.foundationMode' \
                "$release_directory/deploy-evidence.json")" == reset ]]
              [[ "$(jq -er '.foundationResetEvidenceDigest' \
                "$release_directory/deploy-evidence.json")" == "$reset_digest" ]]
              deploy_args+=(--foundation-reset-evidence "$foundation_reset_evidence")
            else
              [[ ! -e "$release_directory/foundation-reset-evidence.json" &&
                ! -L "$release_directory/foundation-reset-evidence.json" ]]
              jq -e '
                (.foundationMode == "fresh" or .foundationMode == "reused")
                and .foundationResetEvidenceDigest == null
              ' "$release_directory/deploy-evidence.json" >/dev/null
            fi
          elif [[ -e "$pending_checkpoint" || -L "$pending_checkpoint" ]]; then
            [[ -f "$pending_checkpoint" && ! -L "$pending_checkpoint" ]]
            jq -e \
              --arg revision "$revision" \
              --arg manifestDigest "$manifest_digest" '
                .schemaVersion == 3
                and .environment == "preview"
                and .namespace == "combo-review"
                and .sourceSha == $revision
                and .releaseId == ("release-" + $revision)
                and .manifestDigest == $manifestDigest
                and (.phase == "armed" or .phase == "post-cut")
              ' "$pending_checkpoint" >/dev/null
            pending_reset_digest=$(jq -r \
              '.foundationResetEvidenceDigest // ""' "$pending_checkpoint")
            if [[ "$foundation_reset" == true ]]; then
              [[ "$pending_reset_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              foundation_reset_evidence=$reset_output
              [[ -f "$foundation_reset_evidence" &&
                ! -L "$foundation_reset_evidence" ]]
              [[ "$(sha256sum "$foundation_reset_evidence" |
                awk '{print "sha256:" $1}')" == "$pending_reset_digest" ]]
              deploy_args+=(--foundation-reset-evidence "$foundation_reset_evidence")
            else
              [[ -z "$pending_reset_digest" ]]
              [[ ! -e "$reset_output" && ! -L "$reset_output" ]]
            fi
          elif [[ "$foundation_reset" == true ]]; then
            foundation_reset_evidence=$reset_output
            deploy_args+=(--foundation-reset-evidence "$foundation_reset_evidence")
          else
            [[ ! -e "$reset_output" && ! -L "$reset_output" ]]
          fi
          if [[ "$foundation_reset" == true ]]; then
            bash "$work/scripts/reset-release-foundation.sh" \
              --operation reset \
              --environment preview \
              --manifest "$work/metadata/release.json" \
              --manifest-digest "$manifest_digest" \
              --foundation-yaml "$work/rendered/preview/foundation.yaml" \
              --authority-digest "$authority_digest" \
              --request-id "$reset_request_id" \
              --policy established-clean-slate-v1 \
              --output "$reset_output"
            cmp -s "$reset_output" "$foundation_reset_evidence"
          else
            bash "$work/scripts/reset-release-foundation.sh" \
              --operation assert-reuse \
              --environment preview \
              --manifest "$work/metadata/release.json" \
              --manifest-digest "$manifest_digest" \
              --foundation-yaml "$work/rendered/preview/foundation.yaml" \
              --authority-digest "$authority_digest" \
              --request-id "$reset_request_id" \
              --policy reuse-existing-v1 \
              --output "$reset_output"
          fi
          bash "$work/scripts/deploy-release.sh" \
            --environment preview \
            --fresh-reset \
            "${deploy_args[@]}" \
            --manifest "$work/metadata/release.json" \
            --manifest-digest "$manifest_digest" \
            --migrations "$work/metadata/migration-files.txt" \
            --foundation-yaml "$work/rendered/preview/foundation.yaml" \
            --init-yaml "$work/rendered/preview/init.yaml" \
            --migrate-yaml "$work/rendered/preview/migrate.yaml" \
            --apps-yaml "$work/rendered/preview/apps.yaml" \
            --web-assets "$work/metadata/web-asset-manifest.json"
          REMOTE

      - name: Fetch and validate the tecent2 Preview evidence
        id: remote_evidence
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          FOUNDATION_RESET: ${{ needs.policy.outputs.foundation_reset }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          evidence_dir="$RUNNER_TEMP/preview-remote-evidence"
          install -d -m 0700 "$evidence_dir"
          ssh release-target bash -s -- "$REVISION" "$FOUNDATION_RESET" <<'REMOTE' |
          set -euo pipefail
          revision=$1
          foundation_reset=$2
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$foundation_reset" == true || "$foundation_reset" == false ]]
          directory="$HOME/data/combo-releases/goal-a/preview/release-$revision"
          files=(
            release.json release.sha256 migration-files.txt web-asset-manifest.json
            foundation.yaml init.yaml migrate.yaml apps.yaml
            traffic-evidence.json cleanup-plan.json cleanup-evidence.json
            deploy-evidence.json SHA256SUMS
          )
          if [[ "$foundation_reset" == true ]]; then
            files+=(foundation-reset-evidence.json)
          else
            [[ ! -e "$directory/foundation-reset-evidence.json" &&
              ! -L "$directory/foundation-reset-evidence.json" ]]
          fi
          for file in "${files[@]}"; do
            [[ -f "$directory/$file" && ! -L "$directory/$file" ]]
          done
          (cd "$directory" && sha256sum --quiet -c SHA256SUMS)
          tar -C "$directory" -czf - "${files[@]}"
          REMOTE
            tar -xzf - -C "$evidence_dir"
          (
            cd "$evidence_dir"
            sha256sum --quiet -c SHA256SUMS
          )
          manifest_digest=$(<"$RELEASE_ROOT/metadata/release-manifest-digest.txt")
          [[ "$(<"$evidence_dir/release.sha256")" == "$manifest_digest" ]]
          cmp -s "$RELEASE_ROOT/metadata/release.json" "$evidence_dir/release.json"
          cmp -s "$RELEASE_ROOT/metadata/migration-files.txt" \
            "$evidence_dir/migration-files.txt"
          cmp -s "$RELEASE_ROOT/metadata/web-asset-manifest.json" \
            "$evidence_dir/web-asset-manifest.json"
          if [[ "$FOUNDATION_RESET" == true ]]; then
            reset_digest=$(sha256sum "$evidence_dir/foundation-reset-evidence.json" |
              awk '{print "sha256:" $1}')
            [[ "$(jq -er '.foundationResetEvidenceDigest' \
              "$evidence_dir/deploy-evidence.json")" == "$reset_digest" ]]
          else
            [[ ! -e "$evidence_dir/foundation-reset-evidence.json" &&
              ! -L "$evidence_dir/foundation-reset-evidence.json" ]]
          fi
          for phase in foundation init migrate apps; do
            cmp -s "$RELEASE_ROOT/rendered/preview/$phase.yaml" \
              "$evidence_dir/$phase.yaml"
          done
          api_image=$(jq -er '.images.api' "$RELEASE_ROOT/metadata/release.json")
          runtime_image=$(jq -er '.images.runtime' "$RELEASE_ROOT/metadata/release.json")
          web_image=$(jq -er '.images.web' "$RELEASE_ROOT/metadata/release.json")
          jq -e \
            --arg revision "$REVISION" \
            --arg manifestDigest "$manifest_digest" \
            --argjson foundationReset "$FOUNDATION_RESET" \
            --arg apiImage "$api_image" \
            --arg runtimeImage "$runtime_image" \
            --arg webImage "$web_image" \
            --slurpfile traffic "$evidence_dir/traffic-evidence.json" \
            --slurpfile cleanup "$evidence_dir/cleanup-evidence.json" '
              .schemaVersion == 1
              and .status == "passed"
              and .environment == "preview"
              and .namespace == "combo-review"
              and .sourceSha == $revision
              and .releaseId == ("release-" + $revision)
              and .manifestDigest == $manifestDigest
              and .checks.foundationReady == true
              and .checks.schemaStructure == true
              and (.schemaStructureDigest | test("^sha256:[0-9a-f]{64}$"))
              and .schemaStructureDigest == .schemaStructure.actualDigest
              and .schemaStructure.actualDigest == .schemaStructure.contractDigest
              and .schemaStructure.verified == true
              and (
                if $foundationReset then
                  .foundationMode == "reset"
                  and .checks.freshFoundation == true
                  and .checks.foundationReset == true
                  and (.foundationResetEvidenceDigest | test("^sha256:[0-9a-f]{64}$"))
                  and .foundationReset.status == "passed"
                  and .foundationReset.environment == "preview"
                  and .foundationReset.sourceSha == $revision
                  and .foundationReset.manifestDigest == $manifestDigest
                  and .foundationReset.authorityDigest == $manifestDigest
                else
                  (.foundationMode == "fresh" or .foundationMode == "reused")
                  and .checks.foundationReset == false
                  and .foundationResetEvidenceDigest == null
                  and .foundationReset == null
                end
              )
              and .checks.releaseStorage == true
              and .checks.minioInitialization == true
              and .checks.exactMigrations == true
              and .checks.applicationImages == true
              and .checks.publicTraffic == true
              and .checks.legacyCleanup == true
              and .traffic == $traffic[0]
              and .cleanup == $cleanup[0]
              and .cleanup.verifiedAbsent == true
              and .storage.environment == "preview"
              and .storage.namespace == "combo-review"
              and .storage.sourceSha == $revision
              and .storage.verified == true
              and (.storage.claims | length) == 3
              and .traffic.environment == "preview"
              and .traffic.sourceSha == $revision
              and .traffic.manifestDigest == $manifestDigest
              and .traffic.checks.publicWebRelease == true
              and .traffic.checks.publicMinioReady == true
              and .traffic.formalOrigin == null
              and .traffic.formalAliasOrigin == null
              and .traffic.formalNginx == null
              and .traffic.routeCas.canary.contract == "preview"
              and .traffic.routeCas.canary.afterMode == "release"
              and .traffic.routeCas.formal == null
              and .traffic.rollback.checkpointId == ("release-" + $revision)
              and (.traffic.rollback.checkpointDigest | test("^sha256:[0-9a-f]{64}$"))
              and .traffic.rollback.persisted == true
              and .migration.image == $apiImage
              and ([.deployments[].image] | sort)
                == ([$apiImage, $apiImage, $runtimeImage, $webImage] | sort)
            ' "$evidence_dir/deploy-evidence.json" >/dev/null
          cleanup_plan_digest=$(sha256sum "$evidence_dir/cleanup-plan.json" |
            awk '{print "sha256:" $1}')
          jq -e \
            --arg revision "$REVISION" \
            --arg manifestDigest "$manifest_digest" \
            --arg cleanupPlanDigest "$cleanup_plan_digest" \
            --slurpfile plan "$evidence_dir/cleanup-plan.json" '
            .schemaVersion == 2
            and .purpose == "superseded-release-cleanup"
            and .environment == "preview"
            and .namespace == "combo-review"
            and .sourceSha == $revision
            and .releaseId == ("release-" + $revision)
            and .manifestDigest == $manifestDigest
            and .cleanupPlanDigest == $cleanupPlanDigest
            and .targets == $plan[0].targets
            and .capturedStorage == $plan[0].capturedStorage
            and .verifiedAbsent == true
          ' "$evidence_dir/cleanup-evidence.json" >/dev/null
          deploy_digest=$(sha256sum "$evidence_dir/deploy-evidence.json" | awk '{print "sha256:" $1}')
          cleanup_digest=$(sha256sum "$evidence_dir/cleanup-evidence.json" | awk '{print "sha256:" $1}')
          printf 'deploy_digest=%s\n' "$deploy_digest" >> "$GITHUB_OUTPUT"
          printf 'cleanup_digest=%s\n' "$cleanup_digest" >> "$GITHUB_OUTPUT"
          install -m 0644 "$evidence_dir/deploy-evidence.json" \
            "$RUNNER_TEMP/preview-remote-deploy-evidence.json"
          install -m 0644 "$evidence_dir/cleanup-evidence.json" \
            "$RUNNER_TEMP/preview-remote-cleanup-evidence.json"

      - name: Record the exact Preview deployment identity
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release="$RELEASE_ROOT/metadata/release.json"
          manifest_digest=$(<"$RELEASE_ROOT/metadata/release-manifest-digest.txt")
          file_set_digest=$(sha256sum "$RELEASE_ROOT/metadata/artifact-files.sha256" |
            awk '{print "sha256:" $1}')
          jq -n \
            --slurpfile release "$release" \
            --arg sourceSha "$REVISION" \
            --argjson sourceCiRunId "$SOURCE_RUN_ID" \
            --argjson sourceCiRunAttempt "$SOURCE_RUN_ATTEMPT" \
            --argjson deploymentRunId "$PREVIEW_RUN_ID" \
            --argjson deploymentRunAttempt "$PREVIEW_RUN_ATTEMPT" \
            --argjson releaseArtifactId "$SOURCE_ARTIFACT_ID" \
            --arg releaseArtifactName "$SOURCE_ARTIFACT_NAME" \
            --arg releaseArtifactDigest "$SOURCE_ARTIFACT_DIGEST" \
            --arg releaseManifestDigest "$manifest_digest" \
            --arg artifactFileSetDigest "$file_set_digest" '{
              schemaVersion: 1,
              environment: "preview",
              namespace: "combo-review",
              sourceSha: $sourceSha,
              sourceCiRunId: $sourceCiRunId,
              sourceCiRunAttempt: $sourceCiRunAttempt,
              deploymentWorkflow: ".github/workflows/preview.yml",
              deploymentRunId: $deploymentRunId,
              deploymentRunAttempt: $deploymentRunAttempt,
              releaseArtifactId: $releaseArtifactId,
              releaseArtifactName: $releaseArtifactName,
              releaseArtifactDigest: $releaseArtifactDigest,
              releaseId: $release[0].releaseId,
              releaseManifestDigest: $releaseManifestDigest,
              artifactFileSetDigest: $artifactFileSetDigest,
              webAssetManifestDigest: $release[0].webAssetManifest,
              images: $release[0].images
            }' >"$RUNNER_TEMP/preview-identity.json"

      - name: Run the exact-bundle six-area Preview browser acceptance
        id: browser_admission
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          IDENTITY: ${{ runner.temp }}/preview-identity.json
          REVIEW_ACCESS_TOKEN: ${{ secrets.CLOUD_REVIEW_ACCESS_TOKEN }}
          ACCEPTANCE_RESEND_API_KEY: ${{ secrets.ACCEPTANCE_RESEND_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$REVIEW_ACCESS_TOKEN" =~ ^[0-9a-f]{64}$ ]] || {
            echo 'The protected cloud-review Environment lacks a valid REVIEW_ACCESS_TOKEN.' >&2
            exit 1
          }
          [[ "$ACCEPTANCE_RESEND_API_KEY" =~ ^re_[A-Za-z0-9_-]{16,252}$ ]] || {
            echo 'The cloud-review Environment lacks a valid full-access acceptance Resend key.' >&2
            exit 1
          }
          validator="$RELEASE_ROOT/scripts/promotion-evidence.mjs"
          [[ -f "$validator" && ! -L "$validator" ]]
          [[ -f "$IDENTITY" && ! -L "$IDENTITY" ]]
          archive="$RUNNER_TEMP/combo-preview-acceptance-${REVISION}.tar.gz"
          tar -C "$RELEASE_ROOT" -czf "$archive" acceptance
          chmod 0600 "$archive"
          remote="data/combo-release-incoming/${REVISION}.preview-acceptance.${RUN_ID}.${RUN_ATTEMPT}.tar.gz"
          temporary=".${REVISION}.preview-acceptance.${RUN_ID}.${RUN_ATTEMPT}.upload"
          ssh release-target 'install -d -m 0700 "$HOME/data/combo-release-incoming"'
          scp -q "$archive" "release-target:$temporary"
          ssh release-target mv -fT -- "$temporary" "$remote"
          set +e
          {
            printf '%s\n' "$REVIEW_ACCESS_TOKEN"
            printf '%s\n' "$ACCEPTANCE_RESEND_API_KEY"
            cat <<'REMOTE'
          set -euo pipefail
          set +x
          incoming=$1
          revision=$2
          run_id=$3
          run_attempt=$4
          [[ "$incoming" == "data/combo-release-incoming/${revision}.preview-acceptance.${run_id}.${run_attempt}.tar.gz" ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]]
          archive="$HOME/$incoming"
          [[ -f "$archive" && ! -L "$archive" ]]
          work=$(mktemp -d "$HOME/data/combo-preview-acceptance.XXXXXX")
          output_dir="$HOME/data/combo-acceptance/preview"
          output="$output_dir/${revision}.${run_id}.${run_attempt}.json"
          cleanup() {
            unset COMBO_REVIEW_ACCESS_TOKEN ACCEPTANCE_RESEND_API_KEY
            rm -f -- "$archive"
            rm -rf -- "$work"
          }
          trap cleanup EXIT
          tar -xzf "$archive" --no-same-owner -C "$work"
          [[ -f "$work/acceptance/live-browser-acceptance.mjs" ]]
          [[ -f "$work/acceptance/playwright-core.tgz" ]]
          install -d -m 0700 "$work/acceptance/node_modules" "$output_dir"
          tar -xzf "$work/acceptance/playwright-core.tgz" \
            --no-same-owner -C "$work/acceptance/node_modules"
          [[ -f "$work/acceptance/node_modules/playwright-core/package.json" ]]
          [[ ! -e "$output" ]]
          [[ -f "$HOME/.nvm/nvm.sh" && ! -L "$HOME/.nvm/nvm.sh" &&
            -s "$HOME/.nvm/nvm.sh" ]]
          # shellcheck disable=SC1091
          source "$HOME/.nvm/nvm.sh"
          nvm use 24 >/dev/null
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          umask 077
          set +e
          node "$work/acceptance/live-browser-acceptance.mjs" \
            --environment preview \
            --revision "$revision" \
            --run-id "$run_id" \
            --run-attempt "$run_attempt" \
            --web-origin https://review.43-160-242-46.sslip.io \
            --output "$output"
          runner_rc=$?
          set -e
          [[ "$runner_rc" == 0 || "$runner_rc" == 1 ]] || exit "$runner_rc"
          [[ -f "$output" && ! -L "$output" ]]
          chmod 0600 "$output"
          [[ "$(stat -c '%a' "$output")" == 600 ]]
          output_bytes=$(stat -c '%s' "$output")
          [[ "$output_bytes" =~ ^[1-9][0-9]*$ && "$output_bytes" -le 1048576 ]]
          exit "$runner_rc"
          REMOTE
          } | ssh release-target \
            "IFS= read -r review_access; IFS= read -r acceptance_resend_api_key; export COMBO_REVIEW_ACCESS_TOKEN=\"\$review_access\" ACCEPTANCE_RESEND_API_KEY=\"\$acceptance_resend_api_key\"; unset review_access acceptance_resend_api_key; exec bash -s -- '$remote' '$REVISION' '$RUN_ID' '$RUN_ATTEMPT'"
          runner_rc=$?
          set -e
          [[ "$runner_rc" == 0 || "$runner_rc" == 1 ]] || exit "$runner_rc"
          remote="data/combo-acceptance/preview/${REVISION}.${RUN_ID}.${RUN_ATTEMPT}.json"
          evidence="$RUNNER_TEMP/preview-browser-acceptance.json"
          scp -q "release-target:$remote" "$evidence"
          chmod 0600 "$evidence"
          ssh release-target rm -f -- "$remote"
          [[ -f "$evidence" && ! -L "$evidence" ]]
          evidence_bytes=$(stat -c '%s' "$evidence")
          [[ "$evidence_bytes" =~ ^[1-9][0-9]*$ && "$evidence_bytes" -le 1048576 ]]
          if [[ "$runner_rc" == 0 ]]; then
            acceptance_status=passed
            evidence_digest=$(node "$validator" validate-live-browser \
              --environment preview \
              --evidence "$evidence" \
              --identity "$IDENTITY")
          else
            acceptance_status=failed
            evidence_digest=$(node "$validator" validate-live-browser-failure \
              --environment preview \
              --evidence "$evidence" \
              --identity "$IDENTITY")
          fi
          [[ "$evidence_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'acceptance_status=%s\n' "$acceptance_status"
            printf 'evidence_digest=%s\n' "$evidence_digest"
          } >>"$GITHUB_OUTPUT"
          if [[ "$acceptance_status" == failed ]]; then
            failure_dir="$RUNNER_TEMP/combo-preview-failure-evidence-${REVISION}-${RUN_ID}-${RUN_ATTEMPT}"
            install -d -m 0700 "$failure_dir"
            install -m 0600 "$evidence" "$failure_dir/preview-live-browser-failure.json"
            install -m 0600 "$IDENTITY" "$failure_dir/preview-promotion-identity.json"
            [[ "$(node "$validator" validate-live-browser-failure \
              --environment preview \
              --evidence "$failure_dir/preview-live-browser-failure.json" \
              --identity "$failure_dir/preview-promotion-identity.json")" == "$evidence_digest" ]]
            mapfile -t failure_files < <(
              find "$failure_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
                LC_ALL=C sort
            )
            [[ "${#failure_files[@]}" == 2 ]]
            [[ "${failure_files[0]}" == preview-live-browser-failure.json ]]
            [[ "${failure_files[1]}" == preview-promotion-identity.json ]]
            ! find "$failure_dir" -mindepth 1 -maxdepth 1 -type l -print -quit | grep -q .
            printf 'failure_path=%s\n' "$failure_dir" >>"$GITHUB_OUTPUT"
          fi

      - name: Upload sanitized Preview browser failure evidence
        id: upload_preview_failure_evidence
        if: ${{ always() && steps.browser_admission.outputs.acceptance_status == 'failed' }}
        uses: actions/upload-artifact@v4
        with:
          name: combo-preview-failure-evidence-${{ needs.policy.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.browser_admission.outputs.failure_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail Preview after preserving browser failure evidence
        if: ${{ always() && steps.browser_admission.outputs.acceptance_status == 'failed' }}
        env:
          FAILURE_UPLOAD_OUTCOME: ${{ steps.upload_preview_failure_evidence.outcome }}
        run: |
          if [[ "$FAILURE_UPLOAD_OUTCOME" == success ]]; then
            echo 'The six-area Preview browser acceptance failed; sanitized failure evidence was preserved.' >&2
          else
            echo 'The six-area Preview browser acceptance failed before evidence upload could be confirmed.' >&2
          fi
          exit 1

      - name: Prove the current Preview checkpoint and complete resource inventory
        id: live_admission
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          IDENTITY: ${{ runner.temp }}/preview-identity.json
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/preview-current-checkpoint.json"
          inventory="$RUNNER_TEMP/preview-resource-inventory.json"
          live_runtime="$RUNNER_TEMP/preview-live-runtime.json"
          ssh release-target bash -s -- "$REVISION" <<'REMOTE' >"$checkpoint"
          set -euo pipefail
          revision=$1
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          file="$HOME/data/combo-releases/goal-a/preview/current.json"
          [[ -f "$file" && ! -L "$file" ]]
          cat "$file"
          REMOTE
          jq -e \
            --arg revision "$REVISION" \
            --arg manifestDigest "$(jq -er '.releaseManifestDigest' "$IDENTITY")" '
              keys == ([
                "environment", "evidencePath", "manifestDigest", "namespace",
                "releaseId", "schemaVersion", "sourceSha", "status"
              ] | sort)
              and .schemaVersion == 1
              and .status == "passed"
              and .environment == "preview"
              and .namespace == "combo-review"
              and .sourceSha == $revision
              and .releaseId == ("release-" + $revision)
              and .manifestDigest == $manifestDigest
              and .evidencePath == (
                "/home/xingzheng/data/combo-releases/goal-a/preview/release-" + $revision
              )
            ' "$checkpoint" >/dev/null

          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          inventory_collector="data/combo-release-incoming/${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.inventory.sh"
          runtime_collector="data/combo-release-incoming/${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.live-runtime.sh"
          inventory_remote="data/combo-acceptance/preview/${REVISION}.${RUN_ID}.${RUN_ATTEMPT}.inventory.json"
          runtime_remote="data/combo-acceptance/preview/${REVISION}.${RUN_ID}.${RUN_ATTEMPT}.live-runtime.json"
          scp -q "$RELEASE_ROOT/scripts/collect-release-inventory.sh" \
            "release-target:.${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.inventory.upload"
          scp -q "$RELEASE_ROOT/scripts/collect-live-runtime-evidence.sh" \
            "release-target:.${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.live-runtime.upload"
          ssh release-target mv -fT -- \
            ".${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.inventory.upload" \
            "$inventory_collector"
          ssh release-target mv -fT -- \
            ".${REVISION}.preview.${RUN_ID}.${RUN_ATTEMPT}.live-runtime.upload" \
            "$runtime_collector"
          ssh release-target bash -s -- \
            "$REVISION" "$inventory_collector" "$runtime_collector" \
            "$inventory_remote" "$runtime_remote" <<'REMOTE'
          set -euo pipefail
          revision=$1
          inventory_collector="$HOME/$2"
          runtime_collector="$HOME/$3"
          inventory_output="$HOME/$4"
          runtime_output="$HOME/$5"
          for file in "$inventory_collector" "$runtime_collector"; do
            [[ -f "$file" && ! -L "$file" ]]
          done
          install -d -m 0700 "$(dirname "$inventory_output")"
          [[ ! -e "$inventory_output" && ! -e "$runtime_output" ]]
          bash "$inventory_collector" \
            --environment preview --source-sha "$revision" --output "$inventory_output"
          bash "$runtime_collector" \
            --environment preview --source-sha "$revision" --output "$runtime_output"
          REMOTE
          ssh release-target cat "$inventory_remote" >"$inventory"
          ssh release-target cat "$runtime_remote" >"$live_runtime"
          chmod 0600 "$inventory" "$live_runtime"
          ssh release-target rm -f -- \
            "$inventory_collector" "$runtime_collector" "$inventory_remote" "$runtime_remote"
          inventory_digest=$(node "$RELEASE_ROOT/scripts/promotion-evidence.mjs" \
            validate-inventory --inventory "$inventory" --identity "$IDENTITY")
          live_runtime_digest=$(node "$RELEASE_ROOT/scripts/promotion-evidence.mjs" \
            validate-live-runtime --evidence "$live_runtime" --identity "$IDENTITY")
          checkpoint_digest=$(sha256sum "$checkpoint" | awk '{print "sha256:" $1}')
          [[ "$inventory_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$live_runtime_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$checkpoint_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            printf 'inventory_digest=%s\n' "$inventory_digest"
            printf 'live_runtime_digest=%s\n' "$live_runtime_digest"
            printf 'checkpoint_digest=%s\n' "$checkpoint_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Create Preview promotion evidence
        env:
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
          REVISION: ${{ needs.policy.outputs.revision }}
          SOURCE_RUN_ID: ${{ needs.policy.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.policy.outputs.source_run_attempt }}
          SOURCE_ARTIFACT_ID: ${{ needs.policy.outputs.source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ needs.policy.outputs.source_artifact_name }}
          SOURCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.source_artifact_digest }}
          TEST_RUN_ID: ${{ needs.policy.outputs.test_run_id }}
          TEST_RUN_ATTEMPT: ${{ needs.policy.outputs.test_run_attempt }}
          TEST_EVIDENCE_ARTIFACT_ID: ${{ needs.policy.outputs.test_evidence_artifact_id }}
          TEST_EVIDENCE_ARTIFACT_NAME: ${{ needs.policy.outputs.test_evidence_artifact_name }}
          TEST_EVIDENCE_ARTIFACT_DIGEST: ${{ needs.policy.outputs.test_evidence_artifact_digest }}
          TEST_IDENTITY_DIGEST: ${{ steps.test_admission.outputs.identity_digest }}
          TEST_BROWSER_ACCEPTANCE_DIGEST: ${{ steps.test_admission.outputs.browser_digest }}
          TEST_SOURCE_RELEASE_DIGEST: ${{ steps.test_admission.outputs.source_release_digest }}
          TEST_DEPLOYMENT_EVIDENCE_DIGEST: ${{ steps.test_admission.outputs.deployment_digest }}
          PREVIEW_RUN_ID: ${{ github.run_id }}
          PREVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REMOTE_DEPLOY_DIGEST: ${{ steps.remote_evidence.outputs.deploy_digest }}
          REMOTE_CLEANUP_DIGEST: ${{ steps.remote_evidence.outputs.cleanup_digest }}
          CHECKPOINT_DIGEST: ${{ steps.live_admission.outputs.checkpoint_digest }}
          INVENTORY_DIGEST: ${{ steps.live_admission.outputs.inventory_digest }}
          LIVE_RUNTIME_DIGEST: ${{ steps.live_admission.outputs.live_runtime_digest }}
          BROWSER_ACCEPTANCE_DIGEST: ${{ steps.browser_admission.outputs.evidence_digest }}
        run: |
          set -euo pipefail
          manifest_digest=$(<"$RELEASE_ROOT/metadata/release-manifest-digest.txt")
          file_set_digest=$(sha256sum "$RELEASE_ROOT/metadata/artifact-files.sha256" | awk '{print "sha256:" $1}')
          identity_digest=$(sha256sum "$RUNNER_TEMP/preview-identity.json" |
            awk '{print "sha256:" $1}')
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          jq -n \
            --slurpfile release "$RELEASE_ROOT/metadata/release.json" \
            --arg sourceSha "$REVISION" \
            --argjson sourceCiRunId "$SOURCE_RUN_ID" \
            --argjson sourceCiRunAttempt "$SOURCE_RUN_ATTEMPT" \
            --argjson sourceArtifactId "$SOURCE_ARTIFACT_ID" \
            --arg sourceArtifactName "$SOURCE_ARTIFACT_NAME" \
            --arg sourceArtifactDigest "$SOURCE_ARTIFACT_DIGEST" \
            --argjson testRunId "$TEST_RUN_ID" \
            --argjson testRunAttempt "$TEST_RUN_ATTEMPT" \
            --argjson testEvidenceArtifactId "$TEST_EVIDENCE_ARTIFACT_ID" \
            --arg testEvidenceArtifactName "$TEST_EVIDENCE_ARTIFACT_NAME" \
            --arg testEvidenceArtifactDigest "$TEST_EVIDENCE_ARTIFACT_DIGEST" \
            --arg testIdentityDigest "$TEST_IDENTITY_DIGEST" \
            --arg testBrowserAcceptanceDigest "$TEST_BROWSER_ACCEPTANCE_DIGEST" \
            --arg testSourceReleaseDigest "$TEST_SOURCE_RELEASE_DIGEST" \
            --arg testDeploymentEvidenceDigest "$TEST_DEPLOYMENT_EVIDENCE_DIGEST" \
            --argjson previewRunId "$PREVIEW_RUN_ID" \
            --argjson previewRunAttempt "$PREVIEW_RUN_ATTEMPT" \
            --arg releaseManifestDigest "$manifest_digest" \
            --arg artifactFileSetDigest "$file_set_digest" \
            --arg identityDigest "$identity_digest" \
            --arg remoteDeployEvidenceDigest "$REMOTE_DEPLOY_DIGEST" \
            --arg remoteCleanupEvidenceDigest "$REMOTE_CLEANUP_DIGEST" \
            --arg checkpointDigest "$CHECKPOINT_DIGEST" \
            --arg resourceInventoryDigest "$INVENTORY_DIGEST" \
            --arg liveRuntimeDigest "$LIVE_RUNTIME_DIGEST" \
            --arg browserAcceptanceDigest "$BROWSER_ACCEPTANCE_DIGEST" \
            --arg deployedAt "$deployed_at" '
              {
                schemaVersion: 4,
                status: "passed",
                environment: "preview",
                namespace: "combo-review",
                sourceSha: $sourceSha,
                sourceCiRunId: $sourceCiRunId,
                sourceCiRunAttempt: $sourceCiRunAttempt,
                sourceArtifactId: $sourceArtifactId,
                sourceArtifactName: $sourceArtifactName,
                sourceArtifactDigest: $sourceArtifactDigest,
                testRunId: $testRunId,
                testRunAttempt: $testRunAttempt,
                testEvidenceArtifactId: $testEvidenceArtifactId,
                testEvidenceArtifactName: $testEvidenceArtifactName,
                testEvidenceArtifactDigest: $testEvidenceArtifactDigest,
                testIdentityDigest: $testIdentityDigest,
                testBrowserAcceptanceDigest: $testBrowserAcceptanceDigest,
                testSourceReleaseDigest: $testSourceReleaseDigest,
                testDeploymentEvidenceDigest: $testDeploymentEvidenceDigest,
                previewRunId: $previewRunId,
                previewRunAttempt: $previewRunAttempt,
                releaseArtifact: ("combo-release-" + $sourceSha),
                releaseManifestDigest: $releaseManifestDigest,
                artifactFileSetDigest: $artifactFileSetDigest,
                identityDigest: $identityDigest,
                remoteDeployEvidenceDigest: $remoteDeployEvidenceDigest,
                remoteCleanupEvidenceDigest: $remoteCleanupEvidenceDigest,
                checkpointDigest: $checkpointDigest,
                resourceInventoryDigest: $resourceInventoryDigest,
                liveRuntimeDigest: $liveRuntimeDigest,
                browserAcceptanceDigest: $browserAcceptanceDigest,
                images: $release[0].images,
                deployedAt: $deployedAt
              }
            ' > "$RUNNER_TEMP/preview-promotion.json"

      - name: Upload the Production admission evidence
        uses: actions/upload-artifact@v4
        with:
          name: combo-preview-promotion-${{ needs.policy.outputs.revision }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/preview-promotion.json
            ${{ runner.temp }}/preview-remote-deploy-evidence.json
            ${{ runner.temp }}/preview-remote-cleanup-evidence.json
            ${{ runner.temp }}/preview-identity.json
            ${{ runner.temp }}/preview-current-checkpoint.json
            ${{ runner.temp }}/preview-resource-inventory.json
            ${{ runner.temp }}/preview-live-runtime.json
            ${{ runner.temp }}/preview-browser-acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient SSH and bundle files
        if: always()
        env:
          REVISION: ${{ needs.policy.outputs.revision }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_ROOT: ${{ runner.temp }}/combo-release
        run: |
          set +e
          cleanup_rc=0
          if [[ -f "$HOME/.ssh/config" ]]; then
            if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ||
              ! "$RUN_ID" =~ ^[1-9][0-9]*$ ||
              ! "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              cleanup_rc=1
            else
              web_image=
              if [[ -f "$RELEASE_ROOT/metadata/release.json" ]]; then
                web_image=$(jq -r '.images.web // ""' \
                  "$RELEASE_ROOT/metadata/release.json" 2>/dev/null)
              fi
              if ! ssh release-target bash -s -- \
                "$REVISION" "$RUN_ID" "$RUN_ATTEMPT" "$web_image" <<'REMOTE'
            set -euo pipefail
            revision=$1
            run_id=$2
            run_attempt=$3
            web_image=$4
            kubeconfig="$HOME/.kube/config"
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]]
            rm -f -- \
              "data/combo-release-incoming/${revision}.preview.${run_id}.${run_attempt}.tar.gz" \
              "data/combo-release-incoming/${revision}.preview-acceptance.${run_id}.${run_attempt}.tar.gz" \
              "data/combo-acceptance/preview/${revision}.${run_id}.${run_attempt}.json" \
              "data/combo-acceptance/preview/${revision}.${run_id}.${run_attempt}.inventory.json" \
              "data/combo-acceptance/preview/${revision}.${run_id}.${run_attempt}.live-runtime.json" \
              ".${revision}.preview.${run_id}.${run_attempt}.upload" \
              ".${revision}.preview-acceptance.${run_id}.${run_attempt}.upload" \
              ".${revision}.preview.${run_id}.${run_attempt}.inventory.upload" \
              ".${revision}.preview.${run_id}.${run_attempt}.live-runtime.upload" \
              "data/combo-release-incoming/${revision}.preview.${run_id}.${run_attempt}.inventory.sh" \
              "data/combo-release-incoming/${revision}.preview.${run_id}.${run_attempt}.live-runtime.sh"
            cleanup_probes() {
              local cleanup_failed=0 current_uid live live_uid name removed
              for name in \
                "combo-preview-pull-${run_id}-${run_attempt}" \
                "combo-preview-pull-${run_id}-${run_attempt}-retry"; do
                if ! live=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
                  get "pod/$name" --ignore-not-found -o json 2>/dev/null); then
                  cleanup_failed=1
                  continue
                fi
                if [[ -z "$live" ]]; then
                  continue
                fi
                if [[ ! "$web_image" =~ ^ghcr\.io/dangdang-tech/combo-web@sha256:[0-9a-f]{64}$ ]] ||
                  ! jq -e \
                    --arg runId "$run_id" \
                    --arg runAttempt "$run_attempt" \
                    --arg image "$web_image" '
                      .metadata.labels["combo.build/smoke"] == "ghcr-pull"
                      and .metadata.labels["combo.build/workflow-run"] == $runId
                      and .metadata.labels["combo.build/workflow-attempt"] == $runAttempt
                      and (.spec.containers | length) == 1
                      and .spec.containers[0].image == $image
                    ' <<<"$live" >/dev/null; then
                  cleanup_failed=1
                  continue
                fi
                if ! live_uid=$(jq -er '.metadata.uid' <<<"$live"); then
                  cleanup_failed=1
                  continue
                fi
                if ! jq -n --arg uid "$live_uid" '{
                  apiVersion: "v1",
                  kind: "DeleteOptions",
                  propagationPolicy: "Foreground",
                  preconditions: {uid: $uid}
                }' |
                  kubectl --kubeconfig "$kubeconfig" \
                    delete --raw="/api/v1/namespaces/combo-review/pods/$name" \
                    -f - >/dev/null; then
                  cleanup_failed=1
                  continue
                fi
                removed=0
                for _ in $(seq 1 60); do
                  if ! live=$(kubectl --kubeconfig "$kubeconfig" -n combo-review \
                    get "pod/$name" --ignore-not-found -o json 2>/dev/null); then
                    cleanup_failed=1
                    break
                  fi
                  if [[ -z "$live" ]]; then
                    removed=1
                    break
                  fi
                  if ! current_uid=$(jq -er '.metadata.uid' <<<"$live") ||
                    [[ "$current_uid" != "$live_uid" ]]; then
                    cleanup_failed=1
                    break
                  fi
                  sleep 1
                done
                ((removed == 1)) || cleanup_failed=1
              done
              ((cleanup_failed == 0))
            }
            cleanup_probes
          REMOTE
              then
                cleanup_rc=1
              fi
            fi
          fi
          if ! rm -f -- \
            "$RUNNER_TEMP/combo-release.zip" \
            "$RUNNER_TEMP/test-evidence.zip" \
            "$RUNNER_TEMP/combo-release-preview-${REVISION}.tar.gz" \
            "$RUNNER_TEMP/combo-preview-acceptance-${REVISION}.tar.gz" \
            "$RUNNER_TEMP/preview-promotion.json" \
            "$RUNNER_TEMP/preview-remote-deploy-evidence.json" \
            "$RUNNER_TEMP/preview-remote-cleanup-evidence.json" \
            "$RUNNER_TEMP/preview-identity.json" \
            "$RUNNER_TEMP/preview-current-checkpoint.json" \
            "$RUNNER_TEMP/preview-resource-inventory.json" \
            "$RUNNER_TEMP/preview-live-runtime.json" \
            "$RUNNER_TEMP/preview-browser-acceptance.json" \
            "$HOME/.ssh/deploy_key" \
            "$HOME/.ssh/known_hosts" \
            "$HOME/.ssh/config"; then
            cleanup_rc=1
          fi
          if ! rm -rf -- \
            "$RUNNER_TEMP/combo-release" \
            "$RUNNER_TEMP/test-evidence" \
            "$RUNNER_TEMP/preview-remote-evidence"; then
            cleanup_rc=1
          fi
          if ((cleanup_rc != 0)); then
            echo 'Preview transient cleanup could not be confirmed.' >&2
          fi
          exit "$cleanup_rc"
