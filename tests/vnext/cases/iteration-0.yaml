    id: FLT-008
    title: Lost Host turn response never starts a second turn
    fault: [Disconnect after Host accepted turn/start]
    assertions: [Invocation becomes UNCERTAIN and Host turn count stays one]
  - <<: *flt
    id: FLT-009
    title: Saved turnId resumes observation
    fault: [Kill after turnId save before started event]
    assertions: [Recovery queries the same turn or reconciles without new dispatch]
  - <<: *flt
    id: FLT-010
    title: RUNNING Worker crash resumes only with observable Host
    fault: [Kill Worker while RUNNING]
    assertions: [Observable Host or VM is resumed otherwise Invocation becomes UNCERTAIN]
  - <<: *flt
    id: FLT-011
    title: Final before SQLite commit needs exact Host evidence
    fault: [Kill after final generation before SQLite commit]
    assertions: [Only an exact completed Host final may be durably recovered otherwise UNCERTAIN]
  - <<: *flt
    id: FLT-012
    title: Durable local final resubmits exact bytes
    fault: [Disconnect after SQLite final commit before Cloud submit]
    assertions: [Exact final is resent and provider attempt count remains one]
  - <<: *flt
    id: FLT-013
    title: Lost terminal ACK does not duplicate answer
    fault: [Disconnect after Cloud terminal commit before ACK]
    assertions: [Replay returns CLOUD_COMMITTED and Assistant message count remains one]
  - <<: *flt
    id: FLT-014
    title: Lost interrupt ACK is not fake cancellation
    fault: [Disconnect after cancel send before interrupt ACK]
    assertions: [State remains CANCEL_REQUESTED or RECONCILING until evidence arrives]
