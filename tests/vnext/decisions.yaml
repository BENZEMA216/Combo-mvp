protocol: combo.vnext-decision-registry/1
schemaVersion: 1
decisions:
  - id: ADR-VNEXT-001
    title: Project staging mutation fails closed
    status: accepted
    owner: Snapshot/Version
    decidedAt: 2026-08-13
    decision: Project 在 enumerate/open/read/close/restat 任一阶段改变时，当前发布尝试以 SNAPSHOT_SOURCE_CHANGED 终止；不得在同一 upload、Idempotency-Key 或 staging 目录上自动重试。Creator 必须重新 Preview，并以新请求创建完整一致的 staging。错误分类为 NOT_RETRYABLE，意思是原请求不可重放，不妨碍用户明确发起新发布。
    alternatives:
      - 自动重读变化文件直到稳定；拒绝，因为会混合时点且无法界定结束。
      - 锁住或修改活 Project；拒绝，因为发布器承诺不改 Creator Project。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §8.4 TOCTOU barriers
      - SNAPSHOT_SOURCE_CHANGED stable error classification
    securityImpact: 防止恶意 rename/symlink race 把 Host canary 或新旧混合 bytes 装入 Snapshot；失败信息不得包含绝对路径或正文。
    reversalTriggers:
      - 引入可证明的一致 filesystem snapshot primitive，且通过同一 TOCTOU corpus。
    protocolVersions: [combo.snapshot-manifest/1, combo.creator-agent-http/1]
    document: docs/vnext/adr/ADR-VNEXT-001.md

  - id: ADR-VNEXT-002
    title: Exact canonical archive implementation identity
    status: accepted
    owner: Protocol
    decidedAt: 2026-08-13
    decision: JSON 使用 combo-rfc8785-jcs/1；tar 使用受审自有 combo-ustar-pax/1，省略 directory entries，文件 mode 0444、uid/gid/mtime 为 0；压缩使用 Node zlib 链接的 zstd 1.5.7，level=9、checksum/content-size on、dictionary-id off、workers=0。任何实现或参数变化都是新协议身份并须重跑 golden bytes。
    alternatives:
      - 声称 tar-stream 版本；拒绝，因为实际 builder 没有使用该依赖。
      - 只冻结 tar/zstd 格式不冻结实现参数；拒绝，因为不能复现 artifact bytes。
    evidence:
      - SnapshotManifest/1 runtime schema and golden fixture
      - Track A deterministic custom packer/parser cross-contract test
    securityImpact: 精确身份阻止实现漂移、歧义 parser 与假 deterministic；canonicalizer 对 sparse array、undefined、非有限数 fail closed。
    reversalTriggers:
      - Node 或 zstd 版本不可获得，或 custom parser 安全审查要求替换；必须升级 Snapshot protocol。
    protocolVersions:
      [combo-rfc8785-jcs/1, combo.snapshot-manifest/1, combo.agent-version-manifest/1]
    document: docs/vnext/adr/ADR-VNEXT-002.md

  - id: ADR-VNEXT-003
    title: Archive compression ratio and byte limits
    status: accepted
    owner: Snapshot/Version
    decidedAt: 2026-08-13
    decision: Snapshot 同时执行 compressedBytes<=50MiB、expandedBytes<=200MiB、单文件<=10MiB、fileCount<=2000 和 expanded/compressed<=100。任何一项超限即在 VERIFIED 前拒绝；compressedBytes 必须大于 0，阈值按整数 bytes 比较，边界值允许，+1 拒绝。
    alternatives:
      - 只限制 expanded bytes；拒绝，因为异常压缩比仍会消耗 CPU/内存。
      - 自适应或按 Creator 配额放宽；拒绝，因为 Alpha 需要统一可测试边界。
    evidence:
      - SnapshotManifest/1 constants and isCompressionRatioAllowed tests
      - creator-hosted-agent-vnext-test-plan.md §8.2 and §8.3
    securityImpact: 限制 zstd/tar bomb、资源 DoS 与 verifier tmpfs 膨胀；错误只返回稳定代码。
    reversalTriggers:
      - 真实 Alpha 数据显示合法项目持续超限，并完成容量、DoS 与成本复审。
    protocolVersions: [combo.snapshot-manifest/1]
    document: docs/vnext/adr/ADR-VNEXT-003.md

  - id: ADR-VNEXT-004
    title: Snapshot path normalization and case collision
    status: accepted
    owner: Snapshot/Version
    decidedAt: 2026-08-13
    decision: Wire path 必须是 UTF-8 NFC、相对路径、正斜杠、按 UTF-8 bytes 严格排序；NFC 后逐路径做 Unicode lowercase collision key，任何重复或 collision 整包拒绝，不做自动改名。禁止项按 lowercase 检查，包括 .git、.gitmodules、.env*、.ssh、.codex、.aws、node_modules、特殊路径和全部 C0/C1。
    alternatives:
      - 保留 NFD 或区分大小写冲突；拒绝，因为 macOS/Linux 恢复语义不一致。
      - 自动重命名冲突项；拒绝，因为会改变 Creator 确认的 Context。
    evidence:
      - SnapshotPathSchema case-fold/control tests
      - project-hostile-paths design fixture
    securityImpact: 防 traversal、跨平台覆盖和危险配置目录泄漏；发布与解包必须复用同一 authoritative schema。
    reversalTriggers:
      - 采用 Unicode full case-fold 新版本并完成跨文件系统迁移/golden 审查。
    protocolVersions: [combo.snapshot-manifest/1]
    document: docs/vnext/adr/ADR-VNEXT-004.md

  - id: ADR-VNEXT-005
    title: Grant revocation makes open conversations read only
    status: accepted
    owner: Product/Web
    decidedAt: 2026-08-13
    decision: Consumer grant 撤销对新请求立即生效。已打开 Conversation 保留消费者读取自己已提交 transcript 的权利，但进入 SUSPENDED/read-only，禁止新 Message、Invocation 和 reconnect dispatch；在途 Invocation 按 ADR-VNEXT-014 安全撤销。撤销前已在云端 durable commit 的 terminal/final 可读，撤销后迟到 final 不发布。
    alternatives:
      - 已打开 Conversation 继续执行到关闭；拒绝，因为撤销不是新会话提示而是授权边界。
      - 删除消费者历史；拒绝，因为会破坏用户可见事实和审计。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §18.1 auth matrix
      - INV-017 tenant isolation
    securityImpact: 消除旧 session/grant 继续花费 Creator quota 或读取 Context 的窗口，同时不伪造/删除已发生的用户事实。
    reversalTriggers:
      - 产品引入有时限的 offline grant token，且撤销 SLA、法律与费用模型另行评审。
    protocolVersions: [combo.creator-agent-http/1, combo.invocation-state-machine/1]
    document: docs/vnext/adr/ADR-VNEXT-005.md

  - id: ADR-VNEXT-006
    title: Conversation history limits close without truncation
    status: accepted
    owner: Product/Web
    decidedAt: 2026-08-13
    decision: Alpha 最多 20 个已接受用户 turn，visible history 是所有已持久化 USER/ASSISTANT 正文 UTF-8 bytes 之和，最大 65536。若新 USER 正文会使任一上限超出，在写 Message/Invocation/Outbox 前返回 CONVERSATION_CONTEXT_LIMIT，使 Conversation SUSPENDED/read-only并提示创建新 Conversation；不截断、不总结、不静默丢历史。
    alternatives:
      - 滑动窗口丢弃最旧消息；拒绝，因为改变多轮语义且无法向用户证明。
      - 模型自动总结；拒绝，因为摘要不确定且会创建隐藏执行。
    evidence:
      - RuntimePolicy maxConversationTurns/maxVisibleHistoryBytes
      - creator-hosted-agent-vnext-architecture.md §7.3-7.4
    securityImpact: 在执行前限制 token/费用 DoS，且避免截断导致安全指令或授权上下文消失。
    reversalTriggers:
      - 有版本化、可见、可审计的 summarization contract 并通过语义/费用 Gate。
    protocolVersions: [combo.agent-version-manifest/1, combo.creator-agent-http/1]
    document: docs/vnext/adr/ADR-VNEXT-006.md

  - id: ADR-VNEXT-007
    title: SSE cursor retention and transcript recovery
    status: accepted
    owner: Product/Web
    decidedAt: 2026-08-13
    decision: terminal PG transaction 必须原子写 ASSISTANT message、Invocation terminal/resultDigest、append-only invocation event、Conversation IDLE/SUSPENDED 和恰好一条独立 consumer_event_outbox；broker_outbox、Redis、进程内 event 均不能代替。outbox 冻结字段为 cursor bigint identity PK、owner/conversation/invocation/source_event、event_type、strict allowlist payload、payload_digest、dedupe_key、PENDING|PUBLISHED、attempt/retry/publish/retain timestamps，UNIQUE(owner_id,source_event_id) 与 UNIQUE(owner_id,dedupe_key)，tenant composite FK + FORCE RLS。event_type 统一为 invocation.terminal；source_event_id 是同一 PG transaction 插入的 append-only Invocation Event bigint id，不是 Worker/Broker 的自由文本 sourceEventId。payload 只含 protocol/schema/type、Conversation/Invocation ID、terminalState、assistantMessageId、resultDigest、errorCode、occurredAt，禁止正文、delta、Credential。consumer_event_streams 以 owner+conversation 为 PK，保存 latest_cursor 与 expired_through_cursor。普通事件从 createdAt 精确保留 7 天；prune 只删除按 cursor 排序的连续到期前缀，并在同 transaction 推进 expired watermark，绝不越过仍保留的较小 cursor。legal/security hold 进入独立审计保留层，不能延长或改写普通 wire outbox row。publisher 只在 PG commit 后 SKIP LOCKED并以 at-least-once投影 Redis/SSE；PUBLISHED 必须清空 nextAttemptAt。decimal Last-Event-ID 非零且 <=expired_through 时返回 410 SSE_CURSOR_EXPIRED，否则按 owner+conversation+cursor严格递增 replay。token delta 可丢且不作为完成事实；过期后客户端 GET 权威 transcript/terminal 再从 latest durable cursor 重开，绝不从 partial delta 拼 final。
    alternatives:
      - 永久保留所有 delta；拒绝，因为成本和敏感面不必要。
      - cursor 过期后从 0 静默重放；拒绝，因为可能漏/重复并掩盖 retention。
    evidence:
      - OpenAPI SSE endpoint and SSE_CURSOR_EXPIRED error policy
      - ConsumerEventOutboxRecordSchema golden binding and replay-watermark tests
      - creator-hosted-agent-vnext-test-plan.md §10.3 terminal transaction
      - creator-hosted-agent-vnext-test-plan.md §18.3
    securityImpact: cursor 仍受 Conversation owner/RLS 检查；猜测 cursor 不得跨租户读取。
    reversalTriggers:
      - 产品需要合规审计长回放并为加密存储、删除和成本建立新策略。
    protocolVersions: [combo.creator-agent-http/1, combo.consumer-event-outbox/1]
    document: docs/vnext/adr/ADR-VNEXT-007.md

  - id: ADR-VNEXT-008
    title: Worker SQLite migration and corruption recovery
    status: accepted
    owner: Creator Worker
    decidedAt: 2026-08-13
    decision: Worker Journal 使用 WAL、synchronous=FULL、foreign_keys=ON 和 forward-only schema version。迁移前 fsync 加密备份，迁移在单事务完成并跑 integrity_check/foreign_key_check；失败恢复原备份并 BLOCKED，禁止 downgrade schema。检测 corruption 时隔离原 DB、停止 READY/dispatch，不得创建空库冒充首次启动；仅从已验证加密备份恢复。若 Cloud 保留已 dispatch 的 PERSISTED Invocation 而本地 Journal/Host dispatch 证据永久丢失，唯一合法路径是 PERSISTED --LOSE_EXECUTION_EVIDENCE--> RECONCILING，在 5 分钟有界对账耗尽后进入 UNCERTAIN；该路径 Host 新调用必须为 0，新安装不得接管或重跑旧 invocationId。
    alternatives:
      - corruption 后删除 DB 重建；拒绝，因为会把可能已执行的请求当未执行。
      - 双向可逆 migration；拒绝，因为状态机语义回滚风险不可控。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §11.1 and §11.6
      - INV-014 and INV-015
    securityImpact: 防本地 journal 丢失导致重复推理、伪 terminal 或凭据混入备份；备份不含长期凭据。
    reversalTriggers:
      - 引入经验证的云端恢复协议，仍须保持 dispatch evidence 与 at-most-once 边界。
    protocolVersions: [combo.worker-journal/1, combo.invocation-state-machine/1]
    document: docs/vnext/adr/ADR-VNEXT-008.md

  - id: ADR-VNEXT-009
    title: Sandbox TTL rebuilds from visible transcript only
    status: accepted
    owner: Runtime/Sandbox
    decidedAt: 2026-08-13
    decision: Sandbox 空闲 10 分钟销毁 VM、thread 和 scratch；下一条消息创建全新 Sandbox，只从固定 AgentVersion、BehaviorContract、只读 Snapshot 与云端消费者可见 transcript 重建。Alpha 不持久化 state volume，不恢复 hidden reasoning，也不声称与旧 thread 内部状态逐字等价。
    alternatives:
      - Conversation state volume 跨 VM 复用；拒绝，尚未证明隔离、清理和版本绑定。
      - 永久在线 Sandbox；拒绝，资源与跨会话攻击面过大。
    evidence:
      - SandboxSpec/1 lifecycle schema
      - creator-hosted-agent-vnext-architecture.md §7.4
    securityImpact: 销毁后不保留消费者 scratch/hidden state；rebuild 仍须新 Attestation 与 active-instance binding。
    reversalTriggers:
      - 固定 Codex 提供版本化 resume artifact，且 state volume 通过 isolation/retention/backup Gate。
    protocolVersions:
      [combo.sandbox-spec/1, combo.sandbox-attestation/1, combo.agent-version-manifest/1]
    document: docs/vnext/adr/ADR-VNEXT-009.md

  - id: ADR-VNEXT-010
    title: Signed one-use model execution capability
    status: accepted
    owner: Runtime/Sandbox
    decidedAt: 2026-08-13
    decision: Cloud 以注册 P-256 key 对 canonical unsigned ExecutionCapability 作 ES256 IEEE-P1363 签名；精确绑定 Capability/Invocation/Conversation/Deployment/Version/Worker/Lease/Fence/providerRequestId/requestDigest/model/effort/budget/notBefore/expiresAt/nonce。Proxy 先验签再绑定，durable use ledger 仅允许 UNUSED→DISPATCHED→DURABLE_RESULT 或 REVOKED；exact replay 只查询旧状态/结果，任何变化安全阻断，provider upstream count<=1。
    alternatives:
      - Caller 传入 capabilityValid boolean；拒绝，因为无法证明签名或字段绑定。
      - 可重复 bearer token；拒绝，因为第二 turn 和预算重放不可控。
    evidence:
      - ExecutionCapabilitySchema, verifier and 100000-run use property model
      - creator-hosted-agent-vnext-test-plan.md §9.4 and §16.2
    securityImpact: capability 最坏权限仅为一个 Invocation 的一次限定模型预算；不可访问 Combo API、MinIO、任意 URL 或刷新自身。
    reversalTriggers:
      - 改用硬件签名或外部 capability service；必须保持 exact binding 和 durable one-use proof。
    protocolVersions: [combo.execution-capability/1, combo.creator-broker/1]
    document: docs/vnext/adr/ADR-VNEXT-010.md

  - id: ADR-VNEXT-011
    title: Snapshot envelope encryption format
    status: accepted
    owner: Security/SRE
    decidedAt: 2026-08-13
    decision: 每个 Snapshot 用 CSPRNG 生成独立 256-bit DEK，archive 与 canonical manifest 共享该 DEK、各自使用唯一 96-bit CSPRNG nonce，严禁复用。两者均为 AES-256-GCM、16-byte tag、cipherBytes=plaintextBytes+36、cipherDigest覆盖完整对象；archive 使用 combo.snapshot-envelope/1 与 ASCII("CSNPENC1")，AAD 绑定 creatorId/snapshotDigest/archiveDigest/final objectKey/plaintextBytes/keyId；manifest 使用 combo.snapshot-manifest-envelope/1 与 ASCII("CSNPMAN1")，AAD 绑定 creatorId/snapshotDigest/final manifest objectKey/plaintextBytes/keyId。DEK 用 RFC3394 AES-256-KW 包裹，32-byte DEK 的 wrappedDek固定40 bytes；nonce/tag/wrappedDek使用canonical base64url。Worker 必须先完成两个加密对象，再以完整 Envelope、cipherBytes、cipherDigest和canonical base64 checksum创建upload session；云端一次返回两个绑定temp key、长度、checksum、If-None-Match和完整metadata的15分钟Signed PUT。Verifier先完整读取并认证两个temp对象、重算manifest/archive/snapshot digest，成功后才conditional promote正式key；失败不得占正式key。真实RFC3394/KMS适配器仍是独立未完成Gate，不得由本协议或测试key冒充。
    alternatives:
      - 仅 MinIO 磁盘加密；拒绝，因为对象/备份泄露可读。
      - 复用一个长期 DEK；拒绝，因为 nonce 管理和爆炸半径不可接受。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §8.5 and §23.4
      - ContextSnapshot envelope encryption architecture
    securityImpact: bit flip、跨 Creator/Object swap、错误 KEK 均在解包前失败；KEK 与数据备份必须分故障域。
    reversalTriggers:
      - 迁移云 KMS 原生 wrap 算法或 Creator-held key；必须发布新 envelope version 和迁移方案。
    protocolVersions:
      [
        combo.creator-agent-http/1,
        combo.snapshot-binary/1,
        combo.snapshot-envelope/1,
        combo.snapshot-manifest-binary/1,
        combo.snapshot-manifest-envelope/1,
        combo.snapshot-manifest/1,
        combo.snapshot-object-storage/1,
      ]
    document: docs/vnext/adr/ADR-VNEXT-011.md

  - id: ADR-VNEXT-012
    title: Evidence backup chat and snapshot retention
    status: accepted
    owner: Security/SRE
    decidedAt: 2026-08-13
    decision: Chat 正文在线保留至 Conversation 最后活动后 30 天；Snapshot 在 serving/Conversation 引用期间保留，最后引用释放后再保留 30 天；Worker 已 CLOUD_COMMITTED terminal/outbox 保留 7 天。PG/MinIO 加密备份滚动保留 30 天，WAL 连续归档保留 7 天；Evidence Bundle 和脱敏审计 metadata 保留 90 天，Evidence Vault synthetic raw 最长 7 天。到期删除可验证，legal/security hold 必须单独审计和披露。
    alternatives:
      - 全部永久保留；拒绝，扩大隐私和密钥暴露面。
      - terminal 后立即删除；拒绝，破坏恢复、对账和 Consumer transcript。
    evidence:
      - data-flow-allowlist/1
      - creator-hosted-agent-vnext-test-plan.md §23 and §20.1
    securityImpact: 正文始终 AEAD，备份删除延迟最多到 30 天滚动窗口；hold 不得成为无期限默认。
    reversalTriggers:
      - 法律辖区或正式付费产品改变保留义务；须更新用户披露与删除演练。
    protocolVersions:
      [combo.vnext-data-flow-allowlist/1, combo.vnext-evidence-bundle/1, combo.creator-agent-http/1]
    document: docs/vnext/adr/ADR-VNEXT-012.md

  - id: ADR-VNEXT-013
    title: Project code execution is forbidden
    status: accepted
    owner: Runtime/Sandbox
    decidedAt: 2026-08-13
    decision: Alpha 把 Project 作为只读 Context，不执行任何 Project bytes。Guest 仅内置 read_context/list_context/search_context，绑定启动 root fd、Version 和 Conversation；shell、解释器、编译器、dynamic loader、external tool 与 Host Context Tool Broker 均关闭。复制到 scratch、memfd、execve/execveat/dlopen 也必须由机器策略拒绝。
    alternatives:
      - 依赖 Prompt 告诉模型不要执行；拒绝，Prompt 不是安全边界。
      - Host 上执行只读命令；拒绝，会打开 Creator HOME/凭据边界。
    evidence:
      - AgentVersion RuntimePolicy and SandboxSpec/1 literals
      - creator-hosted-agent-vnext-test-plan.md §15.5
    securityImpact: 将公开 Agent 的能力固定为问答，不成为 RCE/供应链执行服务；失败不得回退 native runtime。
    reversalTriggers:
      - 新产品明确需要 Action，必须独立 capability、隔离、审批和协议立项，不能沿用本 Gate。
    protocolVersions: [combo.agent-version-manifest/1, combo.sandbox-spec/1]
    document: docs/vnext/adr/ADR-VNEXT-013.md

  - id: ADR-VNEXT-014
    title: Security revoke forces cancellation or uncertainty
    status: accepted
    owner: Cloud/Broker
    decidedAt: 2026-08-13
    decision: Security revoke 以云端 effectiveAt 为界，原子停止新 dispatch、撤销 Worker session/Lease/Execution Capability并要求 Sandbox 销毁。effectiveAt 前已云端提交的 terminal 不改；其余 Invocation 进入 CANCEL_REQUESTED。能证明未执行或 interrupt confirmed 才 CANCELLED；可能已 dispatch 但证据不足在 5 分钟内对账，仍不明则 UNCERTAIN。effectiveAt 后 final 永不发布且不转 SUCCEEDED。
    alternatives:
      - 等在途自然结束；拒绝，因为继续访问被撤销 Context/预算。
      - 一律标 CANCELLED；拒绝，因为无法证明模型未执行。
    evidence:
      - Invocation state machine cancellation evidence rules
      - creator-hosted-agent-vnext-test-plan.md §9.3 and FLT-014/015/016
    securityImpact: 安全下线优先于可用性，同时保持终态事实不可篡改、不自动重跑。
    reversalTriggers:
      - Provider 提供可证明 atomic cancel-before-execute receipt，可缩短 UNCERTAIN 路径。
    protocolVersions:
      [combo.invocation-state-machine/1, combo.creator-broker/1, combo.execution-capability/1]
    document: docs/vnext/adr/ADR-VNEXT-014.md

  - id: ADR-VNEXT-015
    title: Model quota exhaustion is degraded not online
    status: accepted
    owner: Cloud/Broker
    decidedAt: 2026-08-13
    decision: Worker 心跳正常但 Creator 模型 quota synthetic probe 失败时，desiredState 保持 ONLINE，observedState 变为 DEGRADED，lastErrorCode=MODEL_QUOTA_EXHAUSTED；Consumer 新消息在创建 Invocation/Outbox 前快速失败 503，已有 transcript 可读。连续一次受限 probe 成功且其他 readiness 全绿后自动回 ONLINE，不创建新 AgentVersion。
    alternatives:
      - 继续显示 ONLINE，直到每次 turn 失败；拒绝，产生 false-online 和费用困惑。
      - 标记 Worker OFFLINE；拒绝，掩盖真正故障层且阻碍诊断。
    evidence:
      - DeploymentView observedState and stable error classification
      - INV-020 readiness invariant
    securityImpact: probe 使用最小固定预算、无用户正文且不泄漏凭据；quota 失败不得触发替代模型或降级 Runtime。
    reversalTriggers:
      - Provider 提供可信实时 quota API，可替换 synthetic probe但保持 DEGRADED 语义。
    protocolVersions: [combo.creator-agent-http/1]
    document: docs/vnext/adr/ADR-VNEXT-015.md

  - id: ADR-VNEXT-016
    title: Exact reconciliation reclaim and capability deadlines
    status: accepted
    owner: Cloud/Broker
    decidedAt: 2026-08-13
    decision: 执行证据丢失时从首个 durable lost-evidence timestamp 起 300 秒内 reconcile，边界到达仍不明即 UNCERTAIN；孤儿 Sandbox/scratch/lease 立即回收并在 300 秒内完成或使 Deployment BLOCKED。Execution Capability expiresAt 不得晚于 Invocation deadlineAt+30秒，且 revoke 可更早失效；所有 deadline 用云端 UTC，测试覆盖前1ms、等于、后1ms。
    alternatives:
      - 无限期 reconcile；拒绝，会永久 stuck 且保留权限。
      - Lease 过期立即把在途标失败；拒绝，会覆盖真实已执行事实。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §12.4 and §30.16
      - Invocation reconciliation property rules
    securityImpact: bounded capability 与资源寿命缩短重放窗口；超时不意味着可重跑。
    reversalTriggers:
      - 真实 provider/host receipt 能缩短窗口；延长必须重新评估费用和攻击面。
    protocolVersions:
      [combo.invocation-state-machine/1, combo.execution-capability/1, combo.creator-broker/1]
    document: docs/vnext/adr/ADR-VNEXT-016.md

  - id: ADR-VNEXT-017
    title: Twenty four hour soak leak budget
    status: accepted
    owner: Security/SRE
    decidedAt: 2026-08-13
    decision: Alpha RC 用同一 release tuple 和 max-alpha-load 连续运行 24 小时；前 30 分钟 warmup 不计 slope，每 10 秒采样，采样空洞>60秒 BLOCKED。warmup 后 Worker RSS 净增<=64MiB且线性 slope<=1MiB/hour，FD 净增<=8，tmp/outbox disk 净增<=64MiB；orphan Sandbox/scratch 数须在5分钟归零。重复 final、第二 provider attempt、false-online、跨租户泄漏必须为0；核心 p95 相对上个接受 RC 回退>20%即 BLOCKED。Evidence taxonomy 中 E7 专指同 release tuple 的 24h soak，E8 专指 off-machine PG/MinIO/KEK DR；两者都可在冻结的 T7-DR 实验环境执行，但不得以 E7 soak 替代 E8 异机恢复。
    alternatives:
      - 只跑 8 小时冒充 Alpha soak；拒绝，DoD 明确要求 24 小时。
      - 只看最终 RSS；拒绝，隐藏中途峰值、重启和样本空洞。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §21, §25 and §31
      - max-alpha-load fixture definition
    securityImpact: 资源泄漏会触发保护模式而非通过自动重启掩盖；测试不得含真实用户数据。
    reversalTriggers:
      - 硬件规格或 Alpha load envelope 改变；新基线必须与旧 tuple 并行测量。
    protocolVersions: [combo.vnext-evidence-bundle/1]
    document: docs/vnext/adr/ADR-VNEXT-017.md

  - id: ADR-VNEXT-018
    title: Data flow encryption RLS and service roles
    status: accepted
    owner: Security/SRE
    decidedAt: 2026-08-13
    decision: 字段落点以 data-flow-allowlist/1 为唯一真源。Snapshot archive Context对象的AAD精确绑定archiveDigest/cipherObjectFormat/creatorId/keyId/objectKey/plaintextBytes/protocol/schemaVersion/snapshotDigest；Snapshot生成早于AgentVersion，不得伪造agentVersionDigest绑定。Chat/Worker result 用 AES-256-GCM、随机唯一96-bit nonce和JCS AAD；云端 AAD 绑定 ownerId/conversationId/messageId/role/schemaVersion，本地再绑定 installationId/invocationId/agentVersionDigest。Broker 中 prompt/delta/final 也必须使用 worker-session AES-256-GCM，AAD 精确绑定 protocol/schemaVersion/envelopeType/messageId/conversationId/invocationId/workerSessionId/role/keyId，并分别重算 aadDigest 与 nonce/ciphertext/tag 的 cipherDigest；frame 禁止敏感明文。tenant/version key 90天轮换，旧 key仅在保留期 decrypt。PG 对全部tenant表启用 FORCE RLS并加复合owner FK；事务 SET LOCAL app.creator_id/app.consumer_id，缺失即 deny。runtime roles固定 combo_agent_api、combo_agent_broker、combo_agent_reconciler，均非owner/NOBYPASSRLS；combo_agent_migrator仅DDL，combo_agent_maintenance为NOLOGIN受审break-glass。
    alternatives:
      - 只靠 Repo owner filter；拒绝，漏一条 query 即跨租户。
      - 单一 combo_app role；拒绝，不满足每服务最小权限和故障隔离。
    evidence:
      - data-flow-allowlist.yaml executable schema
      - creator-hosted-agent-vnext-test-plan.md §10.4, §20.2 and §22.6
    securityImpact: RLS 与复合 FK defense-in-depth；Broker/Reconciler 跨租户工作只经限权 view/SECURITY DEFINER claim 后逐租户 SET LOCAL，不能直接读正文。密钥不进模型、argv/env/log。
    reversalTriggers:
      - 数据库拆分为物理 per-tenant 或服务边界变化；必须保持等价隔离与迁移负向测试。
    protocolVersions:
      [combo.vnext-data-flow-allowlist/1, combo.message-envelope/1, combo.creator-agent-http/1]
    document: docs/vnext/adr/ADR-VNEXT-018.md

  - id: ADR-VNEXT-019
    title: Local Control API trusts the signed-in macOS user
    status: accepted
    owner: Creator Worker
    decidedAt: 2026-08-13
    decision: Alpha release Local Control 只监听 parent 0700、socket 0600 的 Unix domain socket；禁用 loopback HTTP。每次连接验证 socket inode/owner/device、peer uid和macOS audit token；状态变更生成短期 nonce并要求 Creator Console 前台确认后由安装 Device key签名，nonce一次性且60秒失效。威胁模型明确不防已控制同一macOS账号且能自动化用户界面的恶意进程；此边界必须在产品/证据中披露。
    alternatives:
      - 仅 Host/Origin loopback token；拒绝，不是正式本地身份边界。
      - Alpha 即拆独立 OS user/XPC privileged service；暂缓，复杂度高且需单独安装/升级模型。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §17.2
      - Creator Console confirmation architecture
    securityImpact: 同 UID 进程不能仅凭 socket 请求静默 publish/online；长期 credential 和绝对路径不进入 argv/env/log。不能宣传防本机账号失陷。
    reversalTriggers:
      - 面向非受控 Creator 或要求抵抗同UID恶意进程时，升级独立OS user/XPC/code-signing ACL。
    protocolVersions: [combo.local-control/1]
    document: docs/vnext/adr/ADR-VNEXT-019.md

  - id: ADR-VNEXT-020
    title: Protection mode thresholds and recovery hysteresis
    status: accepted
    owner: Security/SRE
    decidedAt: 2026-08-13
    decision: root free<35GiB告警；root<25GiB或<15%阻止新Snapshot。data>70%告警，>80%阻止新发布并只允许安全Reclaimer，>90%再拒绝新Conversation。available RAM<2GiB停止后台Job/rollout；swap持续增长或OOM停止扩大Alpha。backup age>1小时或最近恢复演练失败立即记RPO breach并阻止发布，2小时后已有Conversation只读且拒绝新Invocation。恢复须 root>=30GiB且>=20%、data<=75%、RAM>=3GiB、backup<=1小时、恢复演练PASS并连续稳定15分钟。
    alternatives:
      - 仅告警不自动阻断；拒绝，单节点资源耗尽会破坏权威数据。
      - 阈值恢复即刻解除；拒绝，会在边界抖动。
    evidence:
      - creator-hosted-agent-vnext-test-plan.md §22.4
      - creator-hosted-agent-vnext-architecture.md §17.5
    securityImpact: Protection Mode 不修改 terminal、不删除被引用 Snapshot、不以清理掩盖备份失败；动作和恢复均写脱敏审计。
    reversalTriggers:
      - 节点/磁盘拓扑、备份 RPO 或容量模型变化，需真实阈值 probe 重新定标。
    protocolVersions: [combo.creator-agent-http/1, combo.vnext-evidence-bundle/1]
    document: docs/vnext/adr/ADR-VNEXT-020.md
