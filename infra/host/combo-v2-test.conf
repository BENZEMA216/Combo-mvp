# combo-v2 验证站：v2-test.43-160-242-46.sslip.io。
# 只新增本文件，不改任何既有 nginx 配置。TLS 证书用 certbot webroot 签发
# （/var/www/combo-v2-acme），cert-name combo-v2-test，与 combo-dev-test 同一模式。
#
# 认证形态：/authz/ 与 /.well-known/jwks.json 直转 authz（登录与公钥端点不过 ForwardAuth）；
# 其余路径由 auth_request 子请求到 authz /authz/assert 校验 session 并把断言注入
# x-combo-assertion 头转发给 restart-life；未登录 302 到 /authz/login?next=<原路径>。
# 登录页自包含（内联 CSS/JS），无静态资源会被 auth_request 拦截。

log_format combo_v2_safe '$remote_addr $status $request_method $host';

server {
  listen 80;
  listen [::]:80;
  server_name v2-test.43-160-242-46.sslip.io;

  access_log /var/log/nginx/combo-v2-safe-access.log combo_v2_safe;
  error_log /dev/null emerg;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/combo-v2-acme;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name v2-test.43-160-242-46.sslip.io;

  ssl_certificate /etc/letsencrypt/live/combo-v2-test/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/combo-v2-test/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/combo-v2-safe-access.log combo_v2_safe;
  error_log /dev/null emerg;
  client_max_body_size 1m;

  location /authz/ {
    proxy_pass http://127.0.0.1:18091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /.well-known/jwks.json {
    proxy_pass http://127.0.0.1:18091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # ForwardAuth 子请求：固定 GET 调 authz 断言端点，只带 Cookie，不带请求体。
  location = /internal/v2-assert {
    internal;
    proxy_method GET;
    proxy_pass http://127.0.0.1:18091/authz/assert?agent_id=restart-life;
    proxy_pass_request_body off;
    proxy_set_header Content-Length '';
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    auth_request /internal/v2-assert;
    auth_request_set $combo_assertion $upstream_http_x_combo_assertion;
    error_page 401 = @v2_login;

    proxy_pass http://127.0.0.1:18092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header x-combo-assertion $combo_assertion;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors on;
    error_page 502 504 = @v2_unavailable;
  }

  # 未登录统一跳登录页，带回跳路径（authz 侧再把 next 收敛为站内相对路径）。
  location @v2_login {
    return 302 https://$host/authz/login?next=$request_uri;
  }

  location @v2_unavailable {
    default_type text/plain;
    return 503 'Combo V2 validation stack is not available.\n';
  }
}
