log_format combo_dev_safe '$remote_addr $status $request_method $host';

map $http_upgrade $combo_dev_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  listen [::]:80;
  server_name test.43-160-242-46.sslip.io test-s3.43-160-242-46.sslip.io;

  access_log /var/log/nginx/combo-dev-test-safe-access.log combo_dev_safe;
  error_log /dev/null emerg;

  location ^~ /.well-known/acme-challenge/ {
    root /var/lib/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name test.43-160-242-46.sslip.io;

  ssl_certificate /etc/letsencrypt/live/combo-dev-test/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/combo-dev-test/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  access_log /var/log/nginx/combo-dev-test-safe-access.log combo_dev_safe;
  error_log /dev/null emerg;

  location / {
    proxy_pass http://127.0.0.1:18083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $combo_dev_connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_intercept_errors on;
    error_page 502 504 = @test_unavailable;
  }

  location @test_unavailable {
    default_type text/plain;
    return 503 'Test environment is not published.\n';
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name test-s3.43-160-242-46.sslip.io;

  ssl_certificate /etc/letsencrypt/live/combo-dev-test/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/combo-dev-test/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # S3 pre-signed credentials live in the query string. Never record a request URI.
  access_log off;
  error_log /dev/null emerg;
  client_max_body_size 512m;

  location / {
    proxy_pass http://127.0.0.1:19003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_intercept_errors on;
    error_page 502 504 = @test_s3_unavailable;
  }

  location @test_s3_unavailable {
    default_type text/plain;
    return 503 'Test object storage is not published.\n';
  }
}
