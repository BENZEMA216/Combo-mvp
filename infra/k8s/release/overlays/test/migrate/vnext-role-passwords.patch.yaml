apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            # Expand-compatible for an existing Test Secret: when all three keys are absent,
            # migration retains the legacy NOLOGIN roles. Supplying a partial group fails closed
            # in provision-app-roles; a runnable Gateway release requires the complete group.
            - name: POSTGRES_AGENT_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: combo-env
                  key: POSTGRES_AGENT_API_PASSWORD
                  optional: true
            - name: POSTGRES_AGENT_BROKER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: combo-env
                  key: POSTGRES_AGENT_BROKER_PASSWORD
                  optional: true
            - name: POSTGRES_AGENT_RECONCILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: combo-env
                  key: POSTGRES_AGENT_RECONCILER_PASSWORD
                  optional: true
