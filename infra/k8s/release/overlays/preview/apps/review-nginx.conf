# Cloud Review uses the same first-party email session as Production. Keep the
# proxy boundary narrow by forwarding only the application session cookie.
map $http_cookie $combo_review_upstream_cookie {
  default "";
  "~(?:^|;\s*)__Host-cb_session=(?<combo_review_session_token>s1\.[A-Za-z0-9_-]{43})(?:;|$)" "__Host-cb_session=$combo_review_session_token";
}

limit_req_zone $binary_remote_addr zone=review_pairing:10m rate=30r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver ${NGINX_RESOLVER} ipv6=off valid=10s;
  set $api_host ${API_UPSTREAM_HOST};
  set $runtime_host ${RUNTIME_UPSTREAM_HOST};
  client_max_body_size 32m;

  location = /__review/healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Compatibility for bookmarks created while Cloud Review had a separate
  # access gate. The page performs strict same-origin returnTo validation and
  # immediately hands off to the normal first-party email login.
  location ~ ^/__review/(?:enter|bootstrap)$ {
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    try_files /__review/entry-redirect.html =404;
  }

  location = /__review/runtime-ready {
    proxy_pass http://$runtime_host:3100/readyz;
    proxy_set_header Host $host;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
  }

  # Release identity and environment configuration are runtime-generated and
  # must never be cached across promotions.
  location = /runtime-config.json {
    alias /var/run/combo-web/runtime-config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /version.json {
    alias /var/run/combo-web/version.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /try/runtime-config.json {
    alias /var/run/combo-web/try-runtime-config.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  location = /web-asset-manifest.json {
    try_files $uri =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
  }

  # Missing content-addressed assets must be a real 404, never the SPA shell.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location ^~ /try/assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location = /try/index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  location ~ ^/api/v1/(tasks|jobs|versions)/.+/events$ {
    proxy_pass http://$api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
  }

  location ^~ /api/v1/runtime/ {
    proxy_pass http://$runtime_host:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding off;
    add_header X-Accel-Buffering no;
  }

  location ^~ /try/ {
    try_files $uri $uri/ /try/index.html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
  }

  # Application logout clears the first-party session; Preview has no second
  # access credential to revoke.
  location = /api/v1/auth/logout {
    proxy_pass http://$api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
    add_header Cache-Control "no-store" always;
  }

  # Pairing endpoints remain public, but retain their own PairAuth/pairing-code
  # checks and never receive the Review token.
  location = /api/v1/connect/script {
    limit_req zone=review_pairing burst=5 nodelay;
    proxy_pass http://$api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
  }

  location ~ ^/api/v1/connect/(?:prepare|upload)$ {
    proxy_pass http://$api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
    client_body_timeout 600s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_request_buffering on;
  }

  location /api/ {
    proxy_pass http://$api_host:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
  }

  location ~ ^/(health|ready)$ {
    proxy_pass http://$api_host:3000;
    proxy_set_header Host $host;
    proxy_set_header Cookie $combo_review_upstream_cookie;
    proxy_set_header X-Review-Token "";
  }
}
