apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          readinessProbe:
            httpGet:
              path: /__review/healthz
              port: 80
          volumeMounts:
            - name: preview-nginx
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            - name: review-entry-redirect
              mountPath: /usr/share/nginx/html/__review/entry-redirect.html
              subPath: entry-redirect.html
              readOnly: true
      volumes:
        - name: preview-nginx
          configMap:
            name: preview-routing
        - name: review-entry-redirect
          configMap:
            name: preview-routing
