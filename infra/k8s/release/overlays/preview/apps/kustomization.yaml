apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: combo-review
namePrefix: release-
resources:
  - ../../../base/apps
patches:
  - path: review-routing.patch.yaml
  - path: ../../app-selector-isolation.patch.yaml
configMapGenerator:
  - name: preview-routing
    files:
      - default.conf.template=review-nginx.conf
      - entry-redirect.html=review-entry-redirect.html
generatorOptions:
  disableNameSuffixHash: true
  immutable: true
labels:
  - includeSelectors: true
    pairs:
      combo.build/release-track: release-v1
