# combo_v2 库迁移 Job：canonical 0000→0011 + V2 0012→0014，并配置五角色密码。
# 五份角色密码中 combo_api / combo_worker / combo_runtime 与现有环境一致（0008 会把
# 这三个实例级角色短暂收紧为 NOLOGIN 再由 provision 以相同密码恢复 LOGIN）。
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app: migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: combo-v2/platform@COMBO_V2_PLATFORM_DIGEST
          command: ['node', '--experimental-strip-types', 'db/scripts/migrate-v2.ts']
          env:
            - name: PGHOST
              value: postgres.combo-foundation
            - name: PGPORT
              value: '5432'
            - name: PGUSER
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_PASSWORD }
            - name: PGDATABASE
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_DB }
            - name: POSTGRES_API_PASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_API_PASSWORD }
            - name: POSTGRES_WORKER_PASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_WORKER_PASSWORD }
            - name: POSTGRES_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_RUNTIME_PASSWORD }
            - name: POSTGRES_AUTHZ_PASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_AUTHZ_PASSWORD }
            - name: POSTGRES_BILLING_PASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_BILLING_PASSWORD }
            - name: EXPECTED_MIGRATION_HEAD
              value: 0014_v2_email_login.sql
            - name: MIGRATION_RUNS
              value: '2'
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
