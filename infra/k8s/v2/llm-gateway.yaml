# V2 模型网关。只在集群内暴露（ClusterIP）；provider key 的唯一持有者。
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: combo-v2
  labels:
    app: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: combo-v2
  labels:
    app: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: combo-v2/platform@COMBO_V2_PLATFORM_DIGEST
          env:
            - name: PROCESS
              value: llm-gateway
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: LLM_GATEWAY_AUTH_MODE
              value: agent
            - name: AUTHZ_JWKS_URL
              value: https://v2-test.43-160-242-46.sslip.io/.well-known/jwks.json
            - name: AUTHZ_ASSERTION_ISSUER
              value: combo-authz
            - name: LLM_GATEWAY_PAYMENT_ADMISSION
              value: 'true'
            - name: BILLING_PAYMENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_PAYMENT_GATEWAY_TOKEN }
            - name: BILLING_BASE_URL
              value: http://billing
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_INTERNAL_TOKEN }
            - name: BILLING_TIMEOUT_MS
              value: '2000'
            - name: PROVIDER_BASE_URL
              valueFrom:
                secretKeyRef: { name: combo-env, key: V2_PROVIDER_BASE_URL }
            - name: PROVIDER_API_KEY
              valueFrom:
                secretKeyRef: { name: combo-env, key: PROVIDER_API_KEY }
            # 验证期估算单价（分 / 百万 token），对账调参时改这里。
            - name: LLM_GATEWAY_PRICING_JSON
              value: '{"default":{"input":20,"output":80},"deepseek/deepseek-v4-flash":{"input":20,"output":80}}'
            - name: LLM_GATEWAY_HOLD_FIXED_COST_CENTS
              value: '1'
            - name: LLM_GATEWAY_DEFAULT_MAX_TOKENS
              value: '4096'
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
