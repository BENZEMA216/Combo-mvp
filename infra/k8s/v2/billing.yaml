# V2 计费服务。ClusterIP 只经主机代理公开支付路径，不公开管理和内部接口。
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: combo-v2
  labels:
    app: billing
spec:
  selector:
    app: billing
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: combo-v2
  labels:
    app: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: combo-v2/platform@COMBO_V2_PLATFORM_DIGEST
          env:
            - name: PROCESS
              value: billing
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: PGHOST
              value: postgres.combo-foundation
            - name: PGPORT
              value: '5432'
            - name: PGDATABASE
              value: combo_v2
            - name: PGUSER
              value: combo_billing
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: combo-env, key: POSTGRES_BILLING_PASSWORD }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)
            - name: BILLING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_INTERNAL_TOKEN }
            - name: BILLING_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_ADMIN_TOKEN }
            - name: BILLING_PAYMENTS_ENABLED
              value: 'true'
            - name: BILLING_PAYMENT_TOKEN_KEY
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_PAYMENT_TOKEN_KEY }
            - name: BILLING_PAYMENT_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_PAYMENT_GATEWAY_TOKEN }
            - name: BILLING_PAYMENT_CHECKOUT_BASE_URL
              value: https://v2-test.43-160-242-46.sslip.io
            - name: BILLING_PAYMENT_HOST_ORIGINS
              value: https://v2-test.43-160-242-46.sslip.io
            - name: BILLING_AUTHZ_BASE_URL
              value: https://v2-test.43-160-242-46.sslip.io
            - name: BILLING_AUTHZ_JWKS_URL
              value: https://v2-test.43-160-242-46.sslip.io/.well-known/jwks.json
            - name: AUTHZ_ASSERTION_ISSUER
              value: combo-authz
            - name: BILLING_LESHOUYING_ENVIRONMENT
              value: TEST
            - name: BILLING_LESHOUYING_INSTITUTION_NO
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_LESHOUYING_INSTITUTION_NO }
            - name: BILLING_LESHOUYING_MERCHANT_NO
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_LESHOUYING_MERCHANT_NO }
            - name: BILLING_LESHOUYING_INSTITUTION_KEY
              valueFrom:
                secretKeyRef: { name: combo-env, key: BILLING_LESHOUYING_INSTITUTION_KEY }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /ready, port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
